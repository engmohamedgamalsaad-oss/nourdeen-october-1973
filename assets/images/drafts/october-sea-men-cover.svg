<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Original maritime history cover illustration</title>
  <desc id="desc">A stylized naval vessel at sea beneath a gold horizon, with a second ship in the distance. This is an illustration, not a historical photograph.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07131c"/><stop offset=".7" stop-color="#12323c"/><stop offset="1" stop-color="#31515a"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#23434b"/><stop offset="1" stop-color="#07151d"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#946c36"/><stop offset=".5" stop-color="#f0cc7d"/><stop offset="1" stop-color="#946c36"/></linearGradient>
