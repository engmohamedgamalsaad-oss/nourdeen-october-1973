<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Karma GLB browser performance test</title>
<script type="importmap">
{
  "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/examples/jsm/": "./node_modules/three/examples/jsm/"
  }
}
</script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#202428}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="karma"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { createRig } from './KarmaRig.node-test-adapter.js';
import { KarmaController } from './KarmaController.node-test-adapter.js';

const canvas = document.getElementById('karma');
const width = window.innerWidth, height = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(width, height, false);
renderer.setClearColor(0x202428, 1);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x62606a, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 1.8);
key.position.set(-250, 500, 800);
scene.add(key);
const camera = new THREE.OrthographicCamera(-width/2, width/2, height/2, -height/2, 0.1, 2500);
camera.position.set(0, 0, 1200);
camera.lookAt(0, 0, 0);
const modelUrl = new URLSearchParams(location.search).get('model');
if (!modelUrl) throw new Error('Missing ?model= URL');
const gltf = await new GLTFLoader().loadAsync(modelUrl);
const rig = createRig(gltf.scene);
const rects = [
  { id: 'a', left: width * 0.12, top: height * 0.48, width: width * 0.28, height: height * 0.22 },
  { id: 'b', left: width * 0.60, top: height * 0.38, width: width * 0.28, height: height * 0.24 }
];
const controller = new KarmaController({
  rig, getCardRects: () => rects,
  viewport: { width, height }, characterHeightPx: Math.min(170, height * 0.23), modelHeight: 1
});
scene.add(controller.object3D);
const gl = renderer.getContext();
const samples = [];
let updateCount = 0;
const renderStep = () => {
  controller.update(1 / 60);
  updateCount++;
  // Simulate controller updates at 60 Hz while sampling the expensive software
  // WebGL render every 12th update (5 render samples per simulated second).
  if (updateCount % 12 === 0) {
    const start = performance.now();
    renderer.render(scene, camera);
    samples.push(performance.now() - start);
  }
};
window.__karmaLoaded = true;
window.__runSixActions = async () => {
  const results = {};
  const drive = async (name, promise, maxSeconds) => {
    const start = performance.now();
    let result = null;
    promise.then(value => { result = value; });
    for (let i = 0; i < maxSeconds * 60 && result === null; i++) {
      renderStep();
      await Promise.resolve();
    }
    if (result === null) {
      throw new Error(name + ' timed out; controller state=' + controller.stateName +
        ', feet=' + controller.pos.x.toFixed(1) + ',' + controller.pos.y.toFixed(1));
    }
    results[name] = { ...result, stateAfter: controller.stateName, elapsedMs: +(performance.now() - start).toFixed(2) };
  };
  await drive('walkTo', controller.walkTo('b', { side: 'top' }), 10);
  await drive('leanOn', controller.leanOn('a', { side: 'right' }), 10);
  for (let i = 0; i < 24; i++) { renderStep(); await Promise.resolve(); }
  results.leanOn.state = controller.stateName;
  await drive('stand', controller.stand(), 1);
  results.stand.state = controller.stateName;
  await drive('jump', controller.jump(), 2);
  await drive('wave', controller.wave(2), 3);
  await drive('tilt', controller.tilt('left', 1.4), 2.5);
  return results;
};
window.__startPerf = () => { samples.length = 0; };
window.__stopPerf = () => {
  const sorted = [...samples].sort((a,b) => a-b);
  const mean = sorted.length ? sorted.reduce((a,b)=>a+b,0)/sorted.length : 0;
  const p95 = sorted.length ? sorted[Math.min(sorted.length-1, Math.floor(sorted.length*0.95))] : 0;
  const glInfo = {
    maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE),
    maxRenderbufferSize: gl.getParameter(gl.MAX_RENDERBUFFER_SIZE),
    renderer: gl.getParameter(gl.RENDERER),
    vendor: gl.getParameter(gl.VENDOR)
  };
  return {
    renderSamples: sorted.length,
    renderThroughputFps: mean > 0 ? +(1000/mean).toFixed(2) : 0,
    meanRenderCallMs: +mean.toFixed(3),
    p95RenderCallMs: +p95.toFixed(3),
    drawCalls: renderer.info.render.calls,
    triangles: renderer.info.render.triangles,
    geometries: renderer.info.memory.geometries,
    textures: renderer.info.memory.textures,
    pixelRatio: renderer.getPixelRatio(),
    viewport: { width, height },
    glInfo,
    note: 'Synchronous update+render throughput on SwiftShader; not a physical-device FPS measurement.'
  };
};
</script>
</body>
</html>
