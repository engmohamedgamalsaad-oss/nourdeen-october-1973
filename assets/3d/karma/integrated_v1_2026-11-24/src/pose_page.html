<script type=module>
import * as THREE from 'three';
import {GLTFLoader} from 'three/examples/jsm/loaders/GLTFLoader.js';
import {createRig} from './KarmaRig.js';
const q=new URLSearchParams(location.search);const glb=q.get('glb')||'karma_skinned_baseline.glb';

poses.forEach(([n,p],i)=>{for(const k in rig.bones)rig.bones[k].rotation.set(0,0,0);for(const k in p)rig.bones[k].rotation.set(...p[k]);g.scene.updateMatrixWorld(true);

</script>
