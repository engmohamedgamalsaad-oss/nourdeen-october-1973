<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اكتبي حكايتك | حكايات أكتوبر 1973</title>
<meta name="description" content="نموذج لإرسال حكاية جديدة عن حرب أكتوبر 1973 لتظهر في الموقع بعد مراجعة المدرسة.">
<link rel="icon" type="image/jpeg" href="assets/homepage/main-cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Marhey:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#f2ca82;--gold2:#c38a48;--bg:#06121c;--line:rgba(226,190,128,.2);--muted:#a8bdc6;--mint:#70dfc0}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,rgba(19,100,111,.25),transparent 34rem),radial-gradient(ellipse at 0% 45%,rgba(163,115,54,.11),transparent 32rem),var(--bg);color:#edf5f6;font-family:"Cairo",sans-serif;line-height:1.9}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:#fff;color:#000;padding:10px 14px;border-radius:8px;z-index:10}
.skip:focus{top:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:15px clamp(16px,4vw,48px);background:rgba(4,15,23,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header a.back{color:#f4e5c8;text-decoration:none;font-weight:800;min-height:44px;display:inline-flex;align-items:center;padding:0 12px;border-radius:10px}
header a.back:hover{background:#ffffff0c}
header a.back:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
main{width:min(800px,94%);margin:clamp(24px,5vw,52px) auto 72px}
.hero{text-align:center;margin-bottom:24px}
.hero-mark{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(112,223,192,.25);background:rgba(112,223,192,.07);color:var(--mint);padding:6px 14px;border-radius:99px;font-size:.82rem;font-weight:800;margin-bottom:12px}
.hero-mark:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px #70dfc0}
h1{font-family:"Marhey","Cairo",sans-serif;color:#ffe2a0;font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.5;margin:0 0 8px;text-align:center}
.lead{text-align:center;color:#c3d1d3;margin:0 auto;max-width:600px}
form{position:relative;background:linear-gradient(145deg,rgba(16,49,62,.94),rgba(7,23,33,.97));border:1px solid var(--line);border-radius:24px;padding:clamp(20px,5vw,38px);display:grid;gap:18px;box-shadow:0 24px 65px rgba(0,0,0,.2);overflow:hidden}
form:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--mint),var(--gold),transparent)}
label.f{display:grid;gap:7px;font-weight:700;color:#f4e5c8}
label.f small{font-weight:400;color:var(--muted);font-size:.88rem;line-height:1.7}
input[type=text],textarea{width:100%;font:500 1rem "Cairo",sans-serif;color:#fff;background:rgba(3,15,23,.7);border:1px solid rgba(181,207,211,.2);border-radius:13px;padding:12px 14px;min-height:49px;transition:border-color .18s,box-shadow .18s}
textarea{resize:vertical;line-height:1.9}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,input[type=checkbox]:focus-visible{outline:3px solid #fff;outline-offset:3px}
input:focus,textarea:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(112,223,192,.1)}
.hp{position:absolute;inset-inline-start:-9999px;width:1px;height:1px;overflow:hidden}
.tip{background:rgba(112,223,192,.07);border:1px solid rgba(112,223,192,.22);border-radius:14px;padding:12px 14px;color:#cfe9e2;font-size:.95rem}
.check{display:flex;gap:11px;align-items:flex-start;font-weight:600;color:#dbe8e8;background:#ffffff05;border:1px solid rgba(181,207,211,.12);border-radius:14px;padding:13px}
.check input{width:22px;height:22px;margin-top:6px;flex:0 0 22px;accent-color:#e3bd78}
button.send{font:800 1.05rem "Cairo",sans-serif;cursor:pointer;border:0;border-radius:13px;padding:14px 26px;min-height:52px;background:linear-gradient(135deg,#f4d18e,#bf8747);color:#171006;box-shadow:0 9px 24px rgba(195,138,72,.16);transition:transform .16s,filter .16s}
button.send:hover{filter:brightness(1.07);transform:translateY(-1px)}
button.send:disabled{opacity:.6;cursor:wait;transform:none}
.msg{padding:13px 16px;border-radius:13px;font-weight:700}
.msg.ok{background:rgba(47,165,107,.15);border:1px solid rgba(47,165,107,.55);color:#a6f0c6}
.msg.err{background:rgba(212,87,90,.15);border:1px solid rgba(212,87,90,.55);color:#ffb6b7}
.count{font-size:.85rem;color:var(--muted);text-align:end}
#msg:empty{display:none}
[hidden]{display:none!important}
@media(max-width:560px){main{width:min(100% - 24px,800px);margin-top:22px}form{border-radius:18px;padding:20px 16px;gap:16px}.hero-mark{font-size:.77rem}header{padding:12px 14px}}
</style>
</head>
<body>
<a class="skip" href="#main">تخطّي إلى المحتوى</a>
<header>
  <a class="back" href="index.html">← الصفحة الرئيسية</a>
</header>
<main id="main">
  <div class="hero"><div class="hero-mark">مساحة إبداع الطالبات</div><h1>اكتبي حكايتك</h1>
  <p class="lead">شاركي بحكاية عن حرب أكتوبر 1973. اكتبيها بالعربية فقط، وبعد مراجعة المدرسة تُترجم تلقائيًا إلى الإنجليزية والفرنسية والإيطالية.</p></div>
  <form id="f" novalidate>
    <label class="f">اسم الطالبة *<input type="text" id="name" maxlength="80" autocomplete="name" required></label>
    <label class="f">الصف والفصل (اختياري)<input type="text" id="grade" maxlength="60" placeholder="مثال: الصف الأول الإعدادي • 1B"></label>
    <label class="f">عنوان الحكاية *<input type="text" id="storyTitle" maxlength="140" required></label>
    <label class="f">عنوان فرعي (اختياري)<input type="text" id="subtitle" maxlength="200"></label>
    <label class="f">نص الحكاية *<small>اكتبي بأسلوبك. افصلي بين الفقرات بسطر فارغ. الحد الأدنى 50 حرفًا.</small><textarea id="body" rows="12" maxlength="12000" required></textarea><span class="count" id="count" aria-live="off"></span></label>
    <label class="f">المصادر (اختياري)<small>سطر لكل مصدر، ويمكن لصق الروابط.</small><textarea id="sources" rows="4" maxlength="2000"></textarea></label>
    <div class="tip">لا تحتاجين لكتابة أي ترجمة؛ تتم الترجمة بالذكاء الاصطناعي وتراجعها المدرسة قبل النشر.</div>
    <div class="hp" aria-hidden="true"><label>Website <input type="text" id="website" tabindex="-1" autocomplete="off"></label></div>
    <label class="check"><input type="checkbox" id="own"><span>كتبت هذه الحكاية بنفسي بأسلوبي، وراجعت معلوماتها مع مصادر موثوقة.</span></label>
    <div id="msg" role="status" aria-live="polite"></div>
    <button class="send" type="submit" id="send">أرسلي الحكاية</button>
  </form>
</main>
<script>
(function(){
  'use strict';
  var API='https://ypwprddkscnfblhftkeb.supabase.co';
  var KEY='sb_publishable_JJnVwx8HQAJNxSok32L-qg_83fXk5Qn';
  function $(id){return document.getElementById(id);}
  function updateCount(){ $('count').textContent=$('body').value.length+' حرفًا'; }
  $('body').addEventListener('input',updateCount); updateCount();
  function show(kind,text){var m=$('msg');m.className='msg '+kind;m.textContent=text;}

  $('f').addEventListener('submit',function(e){
    e.preventDefault();
    if($('website').value) return; /* خانة مخفية: الروبوتات فقط تملؤها */
    var d={
      student_name:$('name').value.trim(),
      grade:$('grade').value.trim()||null,
      title:$('storyTitle').value.trim(),
      subtitle:$('subtitle').value.trim()||null,
      body:$('body').value.trim(),
      sources:$('sources').value.trim()||null,
      status:'pending'
    };
    if(d.student_name.length<2||d.title.length<3||d.body.length<50||!$('own').checked){
      show('err','راجعي الحقول: الاسم والعنوان مطلوبان، ونص الحكاية 50 حرفًا على الأقل، وأكّدي الإقرار.'); return;
    }
    var last=0; try{last=Number(localStorage.getItem('story-submit-last')||0);}catch(x){}
    if(Date.now()-last<60000){show('err','انتظري قليلًا قبل إرسال حكاية أخرى.');return;}
    var btn=$('send'); btn.disabled=true; btn.textContent='جارٍ الإرسال…';
    fetch(API+'/rest/v1/submitted_stories',{
      method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify(d)
    }).then(function(r){
      if(!r.ok) throw new Error(String(r.status));
      try{localStorage.setItem('story-submit-last',String(Date.now()));}catch(x){}
      $('f').reset(); updateCount(); show('ok','تم الإرسال بنجاح! ستظهر حكايتك بعد مراجعة المدرسة. شكرًا لك.');
    }).catch(function(){
      show('err','تعذر الإرسال الآن. جرّبي مرة أخرى بعد قليل.');
    }).then(function(){ btn.disabled=false; btn.textContent='أرسلي الحكاية'; });
  });
})();
</script>
</body>
</html>
