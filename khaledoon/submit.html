<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>اقترح حكاية | خالدون عبر التاريخ</title>
<link rel="stylesheet" href="assets/khaledoon.css"><link rel="stylesheet" href="assets/khaledoon-forms.css">
<style>.formwrap{max-width:850px;margin:2rem auto;padding:1rem}.field{display:grid;gap:.4rem;margin:1rem 0}.field input,.field textarea,.field select{width:100%;padding:.8rem;border:1px solid var(--line, #777);border-radius:10px;background:var(--panel,#fff);color:inherit;font:inherit}.field textarea{min-height:120px}.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}.notice{padding:1rem;border-radius:12px;margin:1rem 0}.hp{position:absolute;left:-10000px}.privacy{display:flex;gap:.7rem;align-items:flex-start}.privacy input{margin-top:.5rem}.counter{font-size:.9rem;opacity:.8}</style>
</head><body>
<header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="mark">خ</span><span>خالدون عبر التاريخ<small>حكاياتٌ تُروى… وأثرٌ يبقى</small></span></a><a class="btn ghost" href="index.html">الرئيسية</a></div></header>
<main class="formwrap"><div class="fhead"><div class="kicker">شاركنا حكاية</div><h1>اقترح حكاية</h1><p>كل المقترحات تُراجع قبل النشر. لن يظهر اسمك أو صفك للزوار.</p></div>
<div id="msg" class="notice" role="status" aria-live="polite" hidden></div>
<form id="storyForm" class="fcard">
<div class="row2"><label class="field">القسم *<select id="section" required><option value="">اختر</option><option value="science">العلم والعلماء</option><option value="learning">التعليم والمعرفة</option><option value="fame">المشاهير والرياضة والفنون</option><option value="history">التاريخ والحضارات</option><option value="curriculum">شخصيات المناهج المصرية</option><option value="readers">اقتراحات القرّاء</option></select></label><label class="field">الشخصية أو الموضوع *<input id="figure" maxlength="120" required></label></div>
<div id="curriculumFields" hidden><div class="row2"><label class="field">المرحلة *<select id="stage"><option value="">اختر المرحلة</option><option value="primary">الابتدائية</option><option value="preparatory">الإعدادية</option><option value="secondary">الثانوية</option></select></label><label class="field">الصف *<select id="grade"><option value="">اختر الصف</option></select></label></div><label class="field">المادة أو الكتاب (اختياري)<input id="subject" maxlength="80"></label></div>
<label class="field">عنوان الحكاية *<input id="title" maxlength="140" required></label><label class="field">عنوان فرعي (اختياري)<input id="subtitle" maxlength="200"></label>
<label class="field">الحكاية بصوتك *<textarea id="body" minlength="50" maxlength="12000" required></textarea><span id="count" class="counter">0 / 12000</span></label>
<label class="field">المصادر (اختياري)<textarea id="sources" maxlength="3000" placeholder="مصدر في كل سطر"></textarea></label><label class="field">ملاحظات عن الصور وحقوقها (اختياري)<textarea id="images" maxlength="1500"></textarea></label>
<div class="row2"><label class="field">اسم أول أو لقب فقط *<input id="narrator" maxlength="40" required autocomplete="off"></label><label class="field">الصف الدراسي (اختياري)<input id="narratorGrade" maxlength="60"></label></div>
<div class="hp" aria-hidden="true"><label>اترك هذا الحقل فارغًا<input id="website" tabindex="-1" autocomplete="off"></label></div>
<div class="hp" aria-hidden="true"><label>اترك هذا الحقل فارغًا<input id="website" tabindex="-1" autocomplete="off"></label></div>
<label class="privacy"><input id="consent" type="checkbox" required><span>أوافق أنا أو ولي أمري إذا كنت دون 18 سنة على إرسال الحكاية للمراجعة. أفهم أن اسمي وصفّي لن يظهرا للعامة، وأن الإرسال لا يعني النشر.</span></label>
<div class="fbar"><button id="send" class="btn primary" type="submit">إرسال للمراجعة</button><a class="btn ghost" href="index.html">إلغاء</a></div>
</form></main>
<script>
(function(){
'use strict';
var API='https://ypwprddkscnfblhftkeb.supabase.co',KEY='sb_publishable_JJnVwx8HQAJNxSok32L-qg_83fXk5Qn';
var $=function(id){return document.getElementById(id)},form=$('storyForm'),section=$('section'),stage=$('stage'),grade=$('grade'),msg=$('msg'),send=$('send');
var words=['الأول','الثاني','الثالث','الرابع','الخامس','السادس'];
function message(kind,text){msg.hidden=false;msg.textContent=text;msg.setAttribute('data-kind',kind);msg.scrollIntoView({behavior:'smooth',block:'center'})}
function fillGrades(){var n=stage.value==='primary'?6:3;grade.textContent='';var o=document.createElement('option');o.value='';o.textContent='اختر الصف';grade.appendChild(o);for(var i=0;i<n;i++){o=document.createElement('option');o.value=String(i+1);o.textContent='الصف '+words[i];grade.appendChild(o)}}
function toggle(){ $('curriculumFields').hidden=section.value!=='curriculum';stage.required=section.value==='curriculum';grade.required=section.value==='curriculum'}
section.addEventListener('change',toggle);stage.addEventListener('change',fillGrades);
$('body').addEventListener('input',function(){$('count').textContent=this.value.length+' / 12000'});
try{var q=new URLSearchParams(location.search);if(q.get('section'))section.value=q.get('section');if(q.get('stage')){stage.value=q.get('stage');fillGrades()}if(q.get('grade'))grade.value=q.get('grade')}catch(e){}toggle();
function val(id){return $(id).value.trim()}function nullable(x){return x||null}
form.addEventListener('submit',async function(e){
 e.preventDefault();msg.hidden=true;
 if($('website').value){form.reset();message('ok','تم استلام الطلب.');return}
 var cur=section.value==='curriculum';
 if(!form.reportValidity())return;
 if($('website').value){form.reset();form.hidden=true;message('ok','وصل مقترحك.');return;}
 if(val('body').length<50){message('err','اكتب 50 حرفًا على الأقل في نص الحكاية.');return}
 var d={section:section.value,stage:cur?stage.value:null,school_grade:cur?Number(grade.value):null,subject:cur?nullable(val('subject')):null,figure_name:val('figure'),narrator_name:val('narrator'),narrator_grade:nullable(val('narratorGrade')),title:val('title'),subtitle:nullable(val('subtitle')),body:val('body'),sources:nullable(val('sources')),images_note:nullable(val('images')),consent:true,status:'pending'};
 try{var last=Number(sessionStorage.getItem('kh_submit_time')||0);if(Date.now()-last<30000){message('err','انتظر قليلًا قبل إرسال مقترح آخر.');return}}catch(e){}
 send.disabled=true;send.textContent='جارٍ الإرسال…';
 try{var res=await fetch(API+'/rest/v1/khaledoon_submissions',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(d)});
 if(!res.ok)throw new Error(res.status===404?'قاعدة بيانات خالدون لم تُجهّز بعد.':'تعذر الإرسال ('+res.status+').');
 try{sessionStorage.setItem('kh_submit_time',String(Date.now()))}catch(e){}
 form.hidden=true;message('ok','وصل مقترحك. سيُراجع قبل النشر، ولن يظهر اسمك أو صفك للعامة.');
 }catch(err){message('err',err.message||'تعذر الاتصال. حاول مرة أخرى.')}finally{send.disabled=false;send.textContent='إرسال للمراجعة'}
});
})();
</script></body></html>
