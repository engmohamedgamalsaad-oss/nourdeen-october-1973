<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة خالدون عبر التاريخ</title><link rel="stylesheet" href="assets/khaledoon.css"><link rel="stylesheet" href="assets/khaledoon-forms.css"><style>.adminwrap{max-width:1100px;margin:2rem auto;padding:1rem}.field{display:grid;gap:.4rem;margin:.7rem 0}.field input,.field textarea,.field select{width:100%;padding:.7rem;border:1px solid var(--line,#777);border-radius:9px;background:var(--panel,#fff);color:inherit;font:inherit}.field textarea{min-height:120px}.item{margin:1rem 0;padding:1rem;border:1px solid var(--line,#aaa);border-radius:14px}.meta{opacity:.8;font-size:.9rem}.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}.actions button{cursor:pointer}.msg{padding:.8rem;border-radius:10px;margin:1rem 0}.pill{display:inline-block;padding:.2rem .6rem;border-radius:999px;background:#ddd;color:#222}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}</style></head>
<body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="mark">خ</span><span>خالدون عبر التاريخ<small>لوحة الإدارة</small></span></a><div class="ctl"><a class="btn ghost" href="index.html">الموقع</a><button id="logout" class="btn ghost" hidden>تسجيل الخروج</button></div></div></header>
<main class="adminwrap"><h1>إدارة الحكايات</h1><p>المقترحات لا تظهر للزوار إلا بعد مراجعتها ونشرها صراحة.</p><div id="message" class="msg" role="status" aria-live="polite" hidden></div>
<section id="loginBox" class="fcard"><h2>دخول المسؤول</h2><form id="loginForm"><label class="field">البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label class="field">كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" id="loginBtn" type="submit">دخول</button></form></section>
<section id="dashboard" hidden><div class="grid"><label class="field">تصفية الحالة<select id="filter"><option value="all">كل الحالات</option><option value="pending">قيد المراجعة</option><option value="review">تحت التحرير</option><option value="published">منشورة</option><option value="rejected">مرفوضة</option></select></label><label class="field">بحث<input id="search" placeholder="العنوان أو الشخصية"></label></div><button class="btn ghost" id="refresh">تحديث القائمة</button><div id="stats" class="grid"></div><div id="items"></div></section>
</main>
<script>
(function(){
'use strict';
var API='https://ypwprddkscnfblhftkeb.supabase.co',KEY='sb_publishable_JJnVwx8HQAJNxSok32L-qg_83fXk5Qn',SESSION='kh_admin_session';
var $=function(id){return document.getElementById(id)},session=null,items=[],filter='all',search='';
function msg(kind,text){var m=$('message');m.hidden=false;m.textContent=text;m.dataset.kind=kind}
function clear(){session=null;try{sessionStorage.removeItem(SESSION)}catch(e){}}
function save(s){session=s;try{sessionStorage.setItem(SESSION,JSON.stringify(s))}catch(e){}}
function read(){try{var s=JSON.parse(sessionStorage.getItem(SESSION)||'null');if(s&&s.access_token&&s.refresh_token)session=s}catch(e){}}
function showLogin(){$('loginBox').hidden=false;$('dashboard').hidden=true;$('logout').hidden=true}
function showDash(){$('loginBox').hidden=true;$('dashboard').hidden=false;$('logout').hidden=false}
function headers(extra){var h={apikey:KEY,'Content-Type':'application/json',Authorization:'Bearer '+(session?session.access_token:KEY)};if(extra)Object.keys(extra).forEach(function(k){h[k]=extra[k]});return h}
async function refreshToken(){if(!session)return;if(session.expires_at-Date.now()/1000>60)return;var r=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(!r.ok){clear();throw new Error('انتهت الجلسة؛ سجّل الدخول مرة أخرى.')}var d=await r.json();save({access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()/1000+d.expires_in})}
async function rest(path,opts){await refreshToken();opts=opts||{};opts.headers=headers(opts.headers);var r=await fetch(API+'/rest/v1/'+path,opts);if(r.status===401){clear();showLogin();throw new Error('انتهت الجلسة. سجّل الدخول مجددًا.')}return r}
async function login(email,password){var r=await fetch(API+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password})});if(!r.ok)throw new Error('تعذر الدخول؛ راجع البريد وكلمة المرور.');var d=await r.json();save({access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Date.now()/1000+d.expires_in});var check=await rest('rpc/is_admin',{method:'POST',body:'{}'});if(!check.ok||(await check.json())!==true){clear();throw new Error('هذا الحساب غير مسجل كمسؤول في قاعدة البيانات.')} }
async function load(){var r=await rest('khaledoon_submissions?select=*&order=created_at.desc');if(!r.ok)throw new Error('تعذر تحميل المقترحات ('+r.status+'). تأكد من تشغيل ملف SQL الخاص بخالدون.');items=await r.json();render()}
function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function field(label,id,value,multiline){var l=el('label','field',label),n=document.createElement(multiline?'textarea':'input');n.id=id;n.value=value||'';if(!multiline)n.maxLength=140;l.appendChild(n);return l}
function button(label,cls,fn){var b=el('button','btn '+(cls||'ghost'),label);b.type='button';b.addEventListener('click',fn);return b}
async function update(it,patch,success){try{var r=await rest('khaledoon_submissions?id=eq.'+encodeURIComponent(it.id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(patch)});if(!r.ok)throw new Error('حفظ الطلب فشل ('+r.status+').');var rows=await r.json();if(!rows.length)throw new Error('لم يتغير السجل؛ تأكد من صلاحية المسؤول.');msg('ok',success||'تم الحفظ.');await load()}catch(e){msg('err',e.message||'حدث خطأ أثناء الحفظ.')}}
async function remove(it){if(!confirm('حذف المقترح نهائيًا؟ لا يمكن التراجع.'))return;try{var r=await rest('khaledoon_submissions?id=eq.'+encodeURIComponent(it.id),{method:'DELETE',headers:{Prefer:'return=representation'}});if(!r.ok)throw new Error('تعذر الحذف ('+r.status+').');msg('ok','تم حذف المقترح.');await load()}catch(e){msg('err',e.message||'تعذر الحذف.')}}
function render(){var host=$('items');host.textContent='';var filtered=items.filter(function(x){return(filter==='all'||x.status===filter)&&(!search||[x.title,x.figure_name].some(function(v){return String(v||'').toLocaleLowerCase().includes(search.toLocaleLowerCase())}))});$('stats').textContent='';[['الإجمالي',items.length],['قيد المراجعة',items.filter(function(x){return x.status==='pending'}).length],['منشورة',items.filter(function(x){return x.status==='published'}).length]].forEach(function(x){var c=el('div','item');c.appendChild(el('b','',x[0]));c.appendChild(el('p','',String(x[1])));$('stats').appendChild(c)});if(!filtered.length){host.appendChild(el('p','item','لا توجد مقترحات مطابقة.'));return}
filtered.forEach(function(it){var card=el('article','item');card.appendChild(el('h2','',it.title||'حكاية بلا عنوان'));card.appendChild(el('p','meta',(it.figure_name||'')+' • '+({pending:'قيد المراجعة',review:'تحت التحرير',published:'منشورة',rejected:'مرفوضة'}[it.status]||it.status)+' • '+new Date(it.created_at).toLocaleString('ar-EG')));card.appendChild(el('p','', 'القسم: '+it.section+(it.section==='curriculum'?' • '+({primary:'ابتدائي',preparatory:'إعدادي',secondary:'ثانوي'}[it.stage]||'')+' • الصف '+(it.school_grade||'')+' • '+(it.subject||'') :'')));card.appendChild(el('p','meta','موافقة الإرسال: '+(it.consent?'مسجلة':'غير مسجلة')+' • الراوي: '+(it.narrator_name||'غير محدد')+' • '+(it.narrator_grade||'')));
var title=field('عنوان الحكاية','title-'+it.id,it.title,false),body=field('النص المحرر','body-'+it.id,it.body,true),hist=field('في ضوء التاريخ','hist-'+it.id,it.history_note,true),sources=field('المصادر','sources-'+it.id,it.sources,true);card.appendChild(title);card.appendChild(body);card.appendChild(hist);card.appendChild(sources);var original=el('details','');original.appendChild(el('summary','','عرض النص الأصلي'));original.appendChild(el('pre','',it.original_body||''));card.appendChild(original);
var actions=el('div','actions');actions.appendChild(button('حفظ التعديلات','primary',function(){update(it,{title:$(title.firstChild.id).value.trim(),body:$(body.firstChild.id).value.trim(),history_note:$(hist.firstChild.id).value.trim()||null,sources:$(sources.firstChild.id).value.trim()||null},'تم حفظ التعديلات.')}));
if(it.status!=='published')actions.appendChild(button('نشر','primary',function(){if(!it.consent){msg('err','لا يمكن النشر دون تسجيل موافقة الإرسال.');return}if(it.section==='curriculum'&&(!it.stage||!it.school_grade)){msg('err','أكمل المرحلة والصف قبل النشر.');return}if($(body.firstChild.id).value.trim().length<50){msg('err','نص الحكاية يجب ألا يقل عن 50 حرفًا.');return}update(it,{title:$(title.firstChild.id).value.trim(),body:$(body.firstChild.id).value.trim(),history_note:$(hist.firstChild.id).value.trim()||null,sources:$(sources.firstChild.id).value.trim()||null,status:'published'},'تم النشر. ستظهر الحكاية العامة بعد تحديث صفحة المناهج.')}));
if(it.status!=='rejected')actions.appendChild(button('رفض','ghost',function(){update(it,{status:'rejected'},'تم رفض المقترح؛ ما زال محفوظًا.')}));
actions.appendChild(button('حذف','ghost',function(){remove(it)}));card.appendChild(actions);host.appendChild(card)})}
$('loginForm').addEventListener('submit',async function(e){e.preventDefault();$('loginBtn').disabled=true;try{await login($('email').value.trim(),$('password').value);$('password').value='';showDash();await load()}catch(err){msg('err',err.message||'تعذر الدخول.')}finally{$('loginBtn').disabled=false}});
$('logout').addEventListener('click',function(){clear();items=[];showLogin();msg('ok','تم تسجيل الخروج.')});$('refresh').addEventListener('click',function(){load().catch(function(e){msg('err',e.message)})});$('filter').addEventListener('change',function(){filter=this.value;render()});$('search').addEventListener('input',function(){search=this.value;render()});
read();if(session){showDash();load().catch(function(e){clear();showLogin();msg('err',e.message)})}else showLogin();
})();
</script></body></html>
