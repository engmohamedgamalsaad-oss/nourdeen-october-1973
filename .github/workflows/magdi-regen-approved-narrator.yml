name: Magdi Yacoub - regenerate narrator with approved voice (cleanup branch)

on:
  push:
    branches:
      - cleanup/remove-experimental-voice
    paths:
      - '.github/workflows/magdi-regen-approved-narrator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install edge-tts
      - name: Regenerate narrator clips (approved voice only; Karma clips stay protected)
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          # CI-only: the pilot guard allowed 5 narrator blocks. All narrator blocks must now be
          # regenerated with the approved voice. The Karma immutability check is NOT relaxed.
          sed -i 's/^FISH_AUDIO_ALLOWED_REGEN_BLOCKS = .*/FISH_AUDIO_ALLOWED_REGEN_BLOCKS = set(range(0, 100))/' scripts/generate_story_audio.py
          python scripts/generate_story_audio.py
          git checkout -- scripts/generate_story_audio.py
      - name: Build the full MP3 from the manifest order
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          d = pathlib.Path("assets/audio/science/magdi-yacoub/ar")
          m = json.loads((d / "manifest.json").read_text(encoding="utf-8"))
          ok = {"karma": "592625f68416462f8b6161ddf5fdbffb", "narrator": "a02a8220d6014812aa5ff73434c54cc0"}
          segs = sorted(m["segments"], key=lambda s: (s["block_index"], s.get("chunk_index", 0)))
          bad = [s["src"] for s in segs if s["voice"] != ok[s["speaker"]]]
          if bad:
              raise SystemExit(f"Unapproved voice in manifest: {bad}")
          out = pathlib.Path("final"); out.mkdir(exist_ok=True)
          lst = out / "concat.txt"
          lst.write_text("".join("file '" + (d / s["src"]).resolve().as_posix() + "'\n" for s in segs), encoding="utf-8")
          final = out / "magdi-yacoub-full-approved-voices.mp3"
          subprocess.run(["ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", str(lst), "-c", "copy", str(final)], check=True)
          info = json.loads(subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration,size", "-of", "json", str(final)], check=True, capture_output=True, text=True).stdout)["format"]
          print("FINAL", info)
          if float(info["duration"]) < 30:
              raise SystemExit("Final MP3 too short")
          (out / "validation.json").write_text(json.dumps({"segments": len(segs), "duration_seconds": float(info["duration"]), "size_bytes": int(info["size"])}, indent=2), encoding="utf-8")
          PY
      - name: Commit regenerated clips and manifest to the cleanup branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/science/magdi-yacoub/ar
          git commit -m "Regenerate Magdi Yacoub narrator clips with approved narrator voice" || echo "Nothing to commit"
          git push
      - name: Upload final MP3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: magdi-yacoub-approved-voices-final-mp3
          path: final/
          if-no-files-found: error
          retention-days: 14
