name: fish-voice-diagnostic
on:
  workflow_dispatch:
    inputs:
      confirm_fish_audio_request:
        description: 'Send two Fish Audio comparison requests after explicit approval'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnose:
    if: inputs.confirm_fish_audio_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect selected voice and generate isolated samples
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error
          out = pathlib.Path("fish-voice-diagnostic")
          out.mkdir()
          key = os.environ["FISH_AUDIO_API_KEY"]
          voice_id = "a02a8220d6014812aa5ff73434c54cc0"
          headers = {"Authorization": f"Bearer {key}"}
          info = {"voice_id": voice_id}
          req = urllib.request.Request(f"https://api.fish.audio/model/{voice_id}", headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  model = json.loads(r.read().decode("utf-8"))
              keep = ("_id", "type", "title", "description", "state", "tags", "languages",
                      "visibility", "default_text", "samples", "source", "pvc_release_state")
              info["model_lookup"] = {k: model.get(k) for k in keep if k in model}
              info["model_lookup_status"] = 200
          except urllib.error.HTTPError as e:
              info["model_lookup_status"] = e.code
              info["model_lookup_error"] = e.read(1000).decode("utf-8", "replace")
          except Exception as e:
              info["model_lookup_error"] = str(e)
          text = "والإجابة تبدأ من الفضول والتعلّم، ثم التدريب الطويل والعمل مع فريق طبي. مجدي يعقوب لم يصبح جرّاح قلب في يوم واحد؛ فقد احتاج الطريق إلى دراسة وخبرة ومهارة."
          variants = {
              "01-current-request": {"text": text, "reference_id": voice_id, "format": "mp3"},
              "02-explicit-defaults": {
                  "text": text, "reference_id": voice_id, "format": "mp3",
                  "temperature": 0.7, "top_p": 0.7,
                  "prosody": {"speed": 1, "volume": 0, "normalize_loudness": True},
                  "normalize": True, "latency": "normal", "mp3_bitrate": 128
              }
          }
          for name, payload in variants.items():
              req = urllib.request.Request(
                  "https://api.fish.audio/v1/tts",
                  data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
                  headers={**headers, "Content-Type": "application/json", "model": "s2.1-pro-free"},
                  method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      audio = r.read()
                  if len(audio) < 512:
                      raise RuntimeError("Fish Audio returned an invalid audio body")
                  (out / f"{name}.mp3").write_bytes(audio)
                  info[name] = {"status": "ok", "bytes": len(audio)}
              except urllib.error.HTTPError as e:
                  info[name] = {"status": "error", "http": e.code,
                                "message": e.read(1000).decode("utf-8", "replace")}
          (out / "diagnostic.json").write_text(json.dumps(info, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps({k:v for k,v in info.items() if k not in ("model_lookup",)}, ensure_ascii=False, indent=2))
          if not all(info.get(n, {}).get("status") == "ok" for n in variants):
              raise SystemExit("One or more diagnostic TTS requests failed")
          PY
      - name: Upload diagnostic audio and model metadata
        uses: actions/upload-artifact@v4
        with:
          name: fish-voice-diagnostic
          path: fish-voice-diagnostic/
          if-no-files-found: error
          retention-days: 7
