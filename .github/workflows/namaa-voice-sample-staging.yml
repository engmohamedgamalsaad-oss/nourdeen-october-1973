name: khaledoon-namaa-voice-sample-staging
run-name: story audio \${{ inputs.request_id }} \${{ inputs.section }}/\${{ inputs.slug }} \${{ inputs.language }} block \${{ inputs.block_index }}

on:
  workflow_dispatch:
    inputs:
      section:
        description: "Sample story section (restricted to history)"
        required: true
        type: string
      slug:
        description: "Sample story slug (restricted to ibn-sina)"
        required: true
        type: string
      story_path:
        description: "Canonical Ibn Sina story package path"
        required: true
        type: string
      language:
        description: "NAMAA currently generates Egyptian Arabic"
        required: true
        type: choice
        options: [ar]
      block_index:
        description: "0 = Karma sample, 1 = narrator sample"
        required: true
        type: number
      confirm_namaa_audio_request:
        description: "Owner approval for this one NAMAA sample"
        required: true
        type: choice
        options: ["no", "yes"]
        default: "no"
      request_id:
        description: "Request ID created by the authenticated review page"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: khaledoon-namaa-sample-\${{ inputs.block_index }}
  cancel-in-progress: false

jobs:
  generate:
    if: inputs.confirm_namaa_audio_request == 'yes' && inputs.section == 'history' && inputs.slug == 'ibn-sina' && inputs.language == 'ar' && (inputs.block_index == 0 || inputs.block_index == 1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the published Ibn Sina story and sample generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1

      - name: Validate sample identity
        env:
          STORY_PATH: \${{ inputs.story_path }}
          SECTION: \${{ inputs.section }}
          SLUG: \${{ inputs.slug }}
          BLOCK_INDEX: \${{ inputs.block_index }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["STORY_PATH"])
          if path.as_posix() != "stories/history/005/story.json":
              raise SystemExit("Unexpected story path")
          story = json.loads(path.read_text(encoding="utf-8"))
          index = int(os.environ["BLOCK_INDEX"])
          expected = "karma" if index == 0 else "narrator"
          if story.get("section") != os.environ["SECTION"] or story.get("slug") != os.environ["SLUG"]:
              raise SystemExit("Story identity mismatch")
          blocks = story.get("i18n", {}).get("ar", {}).get("blocks", [])
          if index not in (0, 1) or index >= len(blocks) or blocks[index].get("speaker") != expected:
              raise SystemExit("Only the first Karma and narrator sample blocks are allowed")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NAMAA client and MP3 converter
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "gradio_client==1.13.3"

      - name: Generate one Egyptian Arabic voice sample with Magdi Yacoub reference
        env:
          HF_TOKEN: \${{ secrets.HF_TOKEN }}
        run: >-
          python scripts/generate_namaa_voice_samples.py
          --story "\${{ inputs.story_path }}"
          --block-index "\${{ inputs.block_index }}"
          --request-id "\${{ inputs.request_id }}"

      - name: Upload the private single-sample review artifact
        uses: actions/upload-artifact@v4
        with:
          name: khaledoon-\${{ inputs.section }}-\${{ inputs.slug }}-\${{ inputs.language }}-audio-staging
          path: .audio-staging/\${{ inputs.section }}/\${{ inputs.slug }}/\${{ inputs.language }}/
          if-no-files-found: error
          retention-days: 14
