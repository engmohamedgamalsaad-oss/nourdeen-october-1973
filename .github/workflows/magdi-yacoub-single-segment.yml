name: Magdi Yacoub — one Arabic audio segment
# A controlled push to this workflow file triggers the one-segment pilot.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/magdi-yacoub-single-segment.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: magdi-yacoub-ar-segment-001
  cancel-in-progress: false
jobs:
  generate-one-segment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate isolated generator syntax
        run: python -m py_compile scripts/generate_magdi_yacoub_single_audio.py
      - name: Generate only segment 001
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: python scripts/generate_magdi_yacoub_single_audio.py
      - name: Verify and commit only the two permitted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/audio/science/magdi-yacoub/ar/001.mp3 assets/audio/science/magdi-yacoub/ar/manifest.json
          expected="$(printf '%s\n' 'assets/audio/science/magdi-yacoub/ar/001.mp3' 'assets/audio/science/magdi-yacoub/ar/manifest.json' | sort)"
          actual="$(git diff --cached --name-only | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'Refusing to commit: staged paths differ from the exact two-file allowlist.' >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'No generated audio change was produced; refusing to report success.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'Replace only Magdi Yacoub Arabic audio segment 001'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
