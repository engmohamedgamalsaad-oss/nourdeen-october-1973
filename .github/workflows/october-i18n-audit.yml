name: October i18n audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/october-i18n-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run read-only October i18n audit
        run: |
          set -euo pipefail
          mkdir -p docs
          python3 scripts/audit_october_i18n.py > docs/october-i18n-audit.txt
          python3 scripts/audit_october_i18n.py --json > docs/october-i18n-audit.json
          python3 scripts/probe_story_body_i18n.py > docs/story-body-i18n-probe.json
          python3 scripts/build_october_audio_packages.py

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: october-i18n-audit
          path: |
            docs/october-i18n-audit.txt
            docs/october-i18n-audit.json
          if-no-files-found: error

      - name: Commit reports to main
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/october-i18n-audit.txt docs/october-i18n-audit.json docs/story-body-i18n-probe.json docs/october-audio-packages-report.txt docs/october-audio-packages-report.json rebuild/october-audio-packages
          if git diff --cached --quiet; then
            echo "Audit reports are unchanged; no commit needed."
            exit 0
          fi
          git commit -m "Add October i18n audit reports [skip ci]"
          git push origin HEAD:main
