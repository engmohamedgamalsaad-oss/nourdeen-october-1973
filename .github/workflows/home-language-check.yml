name: Homepage language flow checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/unified-home-language-2026-10-14

jobs:
  static-language-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify homepage-only language flow
        run: node scripts/check-home-language.js
      - name: Verify five-language localization coverage
        run: node scripts/check-localization-coverage.js
