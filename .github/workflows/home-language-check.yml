name: Homepage language flow checks
# Includes source-data and marker synchronization checks for the cinematic globe.
# The globe regression check also guards the section-color and location-warning parity.

on:
  pull_request:
  push:
    branches:
      - main
      - feature/unified-home-language-2026-10-14

jobs:
  static-language-flow:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check story gate, map links, and admin prompt JavaScript syntax
        run: node --check scripts/check-new-story-readiness.js && node --check scripts/check-map-story-links.js && node --check khaledoon/assets/khaledoon-map.js && node --check khaledoon/assets/khaledoon-admin-texts.js
      - name: Verify all published stories are linked from the interactive map
        run: node scripts/check-map-story-links.js
      - name: Verify Natural Earth globe geometry, colors, and story-point integration
        run: node scripts/check-natural-earth-globe.js
      - name: Verify generated story header and language switch
        run: node khaledoon/tests/story-template-bundle.test.cjs
      - name: Verify readiness of every newly added story
        env:
          STORY_CHECK_BASE: ${{ github.base_ref || 'main' }}
        run: node scripts/check-new-story-readiness.js
      - name: Verify homepage-only language flow
        run: node scripts/check-home-language.js
      - name: Verify five-language translation coverage
        run: node scripts/check-localization-coverage.js
      - name: Verify admin story visibility integration
        run: node scripts/check-story-visibility-flow.js
      - name: Install Chromium for real-browser checks
        timeout-minutes: 8
        run: |
          npm install --no-save playwright
          # GitHub-hosted Ubuntu runners already provide Chromium's common system libraries.
          # Avoid apt-based --with-deps here: slow package-mirror downloads can time out before browser tests start.
          npx playwright install chromium
      - name: Run real-browser language and responsive sweep
        timeout-minutes: 12
        run: node scripts/e2e-language-flow.cjs --out language-e2e-report.json
      - name: Upload browser audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-e2e-report
          path: language-e2e-report.json
          if-no-files-found: ignore
      - name: Upload mobile and desktop audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-audit-screenshots
          path: language-audit-screenshots/*.png
          if-no-files-found: ignore
