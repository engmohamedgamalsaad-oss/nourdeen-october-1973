name: Repository-wide story audio audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/audit_story_audio.py'
      - 'scripts/review_pronunciation.py'
      - 'scripts/generate_story_audio.py'
      - 'scripts/audio_text_guard.py'
      - 'tests/test_audio_text_guard.py'
      - 'tests/test_audit_story_audio.py'
      - 'stories/**/story.json'
      - 'stories/**/audio-pronunciation.json'
      - 'assets/audio/**/manifest.json'
      - '.github/workflows/story-audio-audit.yml'

permissions:
  contents: read

concurrency:
  group: story-audio-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run read-only audit unit tests
        run: python -m unittest discover -s tests -p 'test_audit_story_audio.py' -v

      - name: Run fail-closed audio text guard tests
        run: python -m unittest discover -s tests -p 'test_audio_text_guard.py' -v

      - name: Compile audio generator without running it
        run: python -m py_compile scripts/audio_text_guard.py scripts/generate_story_audio.py

      - name: Install dependency for local dry-run only
        run: python -m pip install edge-tts

      - name: Dry-run every published non-pilot story without writing files or calling TTS
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          before = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          checked = 0
          for story_path in sorted(Path("stories").glob("*/*/story.json")):
              package = json.loads(story_path.read_text(encoding="utf-8"))
              if package.get("section") == "october":
                  continue
              if package.get("section") == "science" and story_path.parent.name == "015":
                  continue  # This pilot is tested separately; its unsafe override must stop.
              metadata_path = story_path.with_name("data.json")
              if not metadata_path.is_file():
                  continue
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              if metadata.get("published") is not True:
                  continue
              subprocess.run(
                  [sys.executable, "scripts/generate_story_audio.py", "--story", str(story_path), "--dry-run"],
                  check=True,
              )
              checked += 1
          after = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          if before != after:
              raise SystemExit("Dry-run changed repository files.")
          print(f"Dry-run validated {checked} published non-pilot stories; no TTS calls or file changes.")
          PY

      - name: Build repository-wide audio inventory (no TTS or ASR)
        run: python scripts/audit_story_audio.py --output "$RUNNER_TEMP/story-audio-audit.json"

      - name: Print concise audit summary
        run: |
          python -c 'import json, pathlib; p=pathlib.Path("'"$RUNNER_TEMP"'/story-audio-audit.json"); r=json.loads(p.read_text(encoding="utf-8")); print(json.dumps({"story_count":r["story_count"],"language_status_counts":r["language_status_counts"],"tts_requests_sent":r["tts_requests_sent"],"asr_requests_sent":r["asr_requests_sent"],"spoken_pronunciation":r["spoken_pronunciation"]}, ensure_ascii=False, indent=2))'

      - name: Upload read-only audit report
        uses: actions/upload-artifact@v4
        with:
          name: story-audio-audit
          path: ${{ runner.temp }}/story-audio-audit.json
          if-no-files-found: error
          retention-days: 14
