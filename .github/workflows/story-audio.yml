name: story-audio-magdi-yacoub-pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_story_audio.py'
      - '.github/workflows/story-audio.yml'

permissions:
  contents: write

concurrency:
  group: magdi-yacoub-arabic-audio-pilot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate the Magdi Yacoub Arabic generator
        run: python -m py_compile scripts/generate_story_audio.py

      - name: Generate Magdi Yacoub Arabic audio; only narrator clips with changed voice hash are regenerated
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: python scripts/generate_story_audio.py

      - name: Commit only the pilot segment and its manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/science/magdi-yacoub/ar/*.mp3 assets/audio/science/magdi-yacoub/ar/manifest.json
          if git diff --cached --quiet; then
            echo 'The approved pilot audio is already current.'
            exit 0
          fi
          git commit -m 'Generate Magdi Yacoub Arabic with approved narrator voice'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
