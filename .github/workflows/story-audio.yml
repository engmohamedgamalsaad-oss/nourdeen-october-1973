name: story-audio-magdi-yacoub-pilot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magdi-yacoub-arabic-audio-pilot
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate the pilot generator
        run: python -m py_compile scripts/generate_magdi_yacoub_single_audio.py

      - name: Generate only Magdi Yacoub Arabic segment 001 when needed
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: python scripts/generate_magdi_yacoub_single_audio.py

      - name: Commit only the pilot segment and its manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/science/magdi-yacoub/ar/001.mp3 assets/audio/science/magdi-yacoub/ar/manifest.json
          if git diff --cached --quiet; then
            echo 'The approved pilot audio is already current.'
            exit 0
          fi
          git commit -m 'Update Magdi Yacoub Arabic pilot audio segment'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
