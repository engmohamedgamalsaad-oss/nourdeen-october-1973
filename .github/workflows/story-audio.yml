name: story-audio
on:
  push:
    branches: [main]
    paths:
      - 'stories/*/*/story.json'
      - 'stories/*/*/data.json'
      - '.github/workflows/story-audio.yml'
      - 'scripts/generate_story_audio.py'
      - 'assets/shared/story-audio.js'
  workflow_dispatch:
    inputs:
      story_path:
        description: 'Optional exact path, e.g. stories/science/015/story.json'
        required: false
        type: string
      all:
        description: 'Generate audio for every published non-October story'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: story-audio-approved-voice-refresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out main
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install audio dependencies
        run: python -m pip install --disable-pip-version-check 'edge-tts>=7.2.0,<8' 'text2tashkeel==0.1.0'
      - name: Validate audio pipeline prerequisites
        run: |
          python -m py_compile scripts/generate_story_audio.py
          node --check assets/shared/story-audio.js
          python - <<'PY'
          from text2tashkeel import Diacritizer
          diacritizer = Diacritizer("rawi-ensemble")
          sample = diacritizer.diacritize("درس الطفل العلم في المدرسة.")
          if not any("\u064b" <= char <= "\u065f" or char == "\u0670" for char in sample):
              raise SystemExit("Arabic diacritizer did not produce vowel marks.")
          print("Arabic diacritizer ready:", sample)
          PY
      - name: Generate audio for manually selected stories
        if: github.event_name == 'workflow_dispatch' && inputs.story_path != ''
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: python scripts/generate_story_audio.py --paths "${{ inputs.story_path }}"
      - name: Generate audio for all published stories
        if: github.event_name == 'workflow_dispatch' && inputs.story_path == '' && inputs.all == 'true'
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: python scripts/generate_story_audio.py --all
      - name: Generate audio for the initial published pilot
        if: github.event_name == 'workflow_dispatch' && inputs.story_path == '' && inputs.all != 'true'
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: python scripts/generate_story_audio.py --paths stories/science/015/story.json
      - name: Generate audio for changed published stories
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t all_changed < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          mapfile -t changed < <(printf '%s\n' "${all_changed[@]}" | grep -E '^stories/[^/]+/[^/]+/(story|data)\.json$' || true)
          if printf '%s\n' "${all_changed[@]}" | grep -Eq '^scripts/generate_story_audio\.py
          declare -a selected=()
          declare -A seen=()
          for file in "${changed[@]}"; do
            dir="$(dirname "$file")"
            candidate="$dir/story.json"
            if [[ -f "$candidate" && -z "${seen[$candidate]+x}" ]]; then
              selected+=("$candidate")
              seen["$candidate"]=1
            fi
          done
          if [[ ${#selected[@]} -gt 0 ]]; then
            FISH_AUDIO_API_KEY="${{ secrets.FISH_AUDIO_API_KEY }}" python scripts/generate_story_audio.py --paths "${selected[@]}"
          else
            echo 'No eligible story package changed.'
          fi
      - name: Commit generated audio to main
        if: success() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p assets/audio
          git add assets/audio
          if git diff --cached --quiet; then
            echo 'Audio files are already current.'
            exit 0
          fi
          git commit -m 'Add generated story audio'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
; then
            echo 'Audio generator changed; refresh all published non-October stories.'
            FISH_AUDIO_API_KEY="${{ secrets.FISH_AUDIO_API_KEY }}" python scripts/generate_story_audio.py --all
            exit 0
          fi
          declare -a selected=()
          declare -A seen=()
          for file in "${changed[@]}"; do
            dir="$(dirname "$file")"
            candidate="$dir/story.json"
            if [[ -f "$candidate" && -z "${seen[$candidate]+x}" ]]; then
              selected+=("$candidate")
              seen["$candidate"]=1
            fi
          done
          if [[ ${#selected[@]} -eq 0 ]]; then
            if [[ -f stories/science/015/story.json ]]; then
              selected=("stories/science/015/story.json")
            fi
          fi
          if [[ ${#selected[@]} -gt 0 ]]; then
            FISH_AUDIO_API_KEY="${{ secrets.FISH_AUDIO_API_KEY }}" python scripts/generate_story_audio.py --paths "${selected[@]}"
          else
            echo 'No eligible story package changed.'
          fi
      - name: Commit generated audio to main
        if: success() && steps.checkout.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p assets/audio
          git add assets/audio
          if git diff --cached --quiet; then
            echo 'Audio files are already current.'
            exit 0
          fi
          git commit -m 'Add generated story audio'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
