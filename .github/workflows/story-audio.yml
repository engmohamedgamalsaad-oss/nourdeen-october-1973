name: story-audio-magdi-yacoub-staging

on:
  workflow_dispatch:
    inputs:
      confirm_fish_audio_request:
        description: "اختر yes فقط بعد الموافقة الصريحة على إرسال طلب توليد إلى Fish Audio"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: magdi-yacoub-arabic-audio-pilot
  cancel-in-progress: false

jobs:
  generate:
    if: inputs.confirm_fish_audio_request == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Install Python audio dependency
        run: python -m pip install edge-tts

      - name: Validate the isolated Arabic staging generator
        run: python -m py_compile scripts/generate_story_audio.py

      - name: Generate only the approved Arabic track into isolated staging
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: >-
          python scripts/generate_story_audio.py
          --story stories/science/015/story.json
          --languages ar
          --generate
          --allow-fish-audio

      - name: Upload staged audio for manual review (never publish automatically)
        uses: actions/upload-artifact@v4
        with:
          name: magdi-yacoub-arabic-audio-staging
          path: .audio-staging/science/magdi-yacoub/ar/
          if-no-files-found: error
          retention-days: 7