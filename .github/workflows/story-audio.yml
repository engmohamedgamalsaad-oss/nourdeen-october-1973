name: story-audio-magdi-yacoub-pilot

on:
  workflow_dispatch:
    inputs:
      confirm_fish_audio_request:
        description: "اختر yes فقط بعد الموافقة الصريحة على إرسال طلب توليد إلى Fish Audio"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: magdi-yacoub-arabic-audio-pilot
  cancel-in-progress: false

jobs:
  generate:
    if: inputs.confirm_fish_audio_request == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python audio dependency
        run: python -m pip install edge-tts

      - name: Validate the Magdi Yacoub Arabic generator
        run: python -m py_compile scripts/generate_story_audio.py

      - name: Run audio generator safety tests
        run: python -m unittest discover -s tests -p 'test_generate_story_audio.py' -v

      - name: Generate Magdi Yacoub Arabic audio
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: python scripts/generate_story_audio.py --allow-fish

      - name: Commit only Magdi Yacoub Arabic audio to a review branch
        id: audio_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "audio/magdi-yacoub-arabic-${GITHUB_RUN_ID}"
          git add assets/audio/science/magdi-yacoub/ar/*.mp3 assets/audio/science/magdi-yacoub/ar/manifest.json
          if git diff --cached --quiet; then
            echo 'The approved pilot audio is already current.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Generate Magdi Yacoub Arabic with approved narrator voice'
          git push origin "HEAD:refs/heads/audio/magdi-yacoub-arabic-${GITHUB_RUN_ID}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Open an audio review pull request
        if: steps.audio_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "audio/magdi-yacoub-arabic-${GITHUB_RUN_ID}" \
            --title "Review generated Magdi Yacoub Arabic audio" \
            --body "Generated only after the explicit Fish Audio confirmation input. Review the MP3 files and manifest before merging. This workflow never pushes audio directly to main."
