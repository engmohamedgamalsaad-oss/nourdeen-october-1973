name: Story workflow mocked tests

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "khaledoon/admin.html"
      - "khaledoon/assets/khaledoon-admin-texts.js"
      - "khaledoon/preview.html"
      - "khaledoon/story-builder.html"
      - "khaledoon/assets/story-workflow.js"
      - "khaledoon/assets/story-template-bundle.js"
      - "khaledoon/assets/ai-json-repair.js"
      - "khaledoon/tests/**"
      - "supabase/functions/publish-story-pr/index.ts"
      - "supabase/functions/audio-review-assets/index.ts"
      - "assets/shared/story-audio.js"
      - "stories/october/**"
      - "scripts/generate_story_audio.py"
      - ".github/workflows/story-audio-segment-staging.yml"
      - "rebuild/**"
      - "scripts/e2e-story-preview.cjs"
      - ".github/workflows/story-workflow-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check publish Edge Function
        run: deno check supabase/functions/publish-story-pr/index.ts
      - name: Type-check private audio staging Edge Function
        run: deno check supabase/functions/audio-review-assets/index.ts
      - name: Compile the audio generator without invoking TTS
        run: python -m py_compile scripts/generate_story_audio.py
      - name: Check public audio player and reader JavaScript syntax
        run: |
          node --check assets/shared/story-audio.js
          node --check rebuild/reader.js
          node --check rebuild/reader-audio-review.js
      - name: Run AI JSON repair tests
        run: node khaledoon/tests/ai-json-repair.test.cjs
      - name: Run workflow unit tests
        run: node khaledoon/tests/story-workflow.test.js
      - name: Run audio review core and preview integration tests
        run: node khaledoon/tests/audio-review-core.test.cjs
      - name: Run image resource validation tests
        run: node khaledoon/tests/image-resource-validation.test.cjs
      - name: Run mocked integration contract tests
        run: node khaledoon/tests/story-workflow-integration.test.js
      - name: Run collision-safe story ID and template tests
        if: ${{ !cancelled() }}
        run: node khaledoon/tests/story-template-bundle.test.cjs
      - name: Install Playwright
        if: ${{ !cancelled() }}
        run: npm install --no-save playwright
      - name: Install Chromium for headless tests
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: |
          # GitHub-hosted Ubuntu runners provide the common Chromium system libraries; avoid apt mirror delays.
          npx playwright install chromium
      - name: Run real-browser unified story preview checks
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node scripts/e2e-story-preview.cjs
      - name: Run mocked headless preview tests
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node khaledoon/tests/story-workflow-browser.test.cjs
      - name: Run desktop/mobile admin visual audit with mock data
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: node khaledoon/tests/admin-visual-audit.test.cjs
      - name: Upload admin and generated story preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-visual-audit-screenshots
          path: |
            artifacts/admin-visual-audit/*.png
            artifacts/story-template-preview/*.png
            artifacts/v2-story-preview/*.png
          if-no-files-found: warn
          retention-days: 14
