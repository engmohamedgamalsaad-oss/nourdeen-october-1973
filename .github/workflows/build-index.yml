name: build-index
on:
  push:
    branches: [main]
    paths:
      - 'stories/*/data.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stories/index.json
        run: |
          for d in stories/[0-9][0-9][0-9]; do
            [ -f "$d/data.json" ] && jq --arg id "$(basename "$d")" '. + {id:$id}' "$d/data.json"
          done | jq -s 'map(select(.published != false)) | sort_by(.order // 9999)' > stories/index.json
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add stories/index.json
          git diff --cached --quiet || (git commit -m "Update stories index" && git push)