name: Extract project media ZIP
on:
  push:
    branches: [backup-before-multilingual-2026-10-10]
    paths:
      - 'WhatsApp Unknown 2026-10-12 at 9.37.08 AM.zip'
      - '.github/workflows/extract-media-zip.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract image files and build visual inventory
        run: |
          set -euo pipefail
          ZIP='WhatsApp Unknown 2026-10-12 at 9.37.08 AM.zip'
          DEST='assets/zip-import'
          mkdir -p "$DEST"
          python -m pip install --quiet pillow
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import io, re, json, shutil
          zpath = Path("WhatsApp Unknown 2026-10-12 at 9.37.08 AM.zip")
          dest = Path("assets/zip-import")
          allowed = {".jpg",".jpeg",".png",".webp",".bmp",".tif",".tiff"}
          items=[]
          with ZipFile(zpath) as z:
              for info in z.infolist():
                  if info.is_dir(): continue
                  p=Path(info.filename)
                  if p.suffix.lower() not in allowed: continue
                  try:
                      data=z.read(info)
                      im=Image.open(io.BytesIO(data))
                      im.verify()
                      im=Image.open(io.BytesIO(data)).convert("RGB")
                  except Exception:
                      continue
                  stem=re.sub(r"[^A-Za-z0-9._-]+","-",p.stem).strip("-._")[:70] or "image"
                  rel=Path("assets/zip-import") / f"{len(items)+1:03d}-{stem}{p.suffix.lower()}"
                  # Preserve original image bytes to avoid degrading source files.
                  rel.write_bytes(data)
                  items.append({"file":str(rel),"source":info.filename,"width":im.width,"height":im.height,"ratio":round(im.width/im.height,3),"bytes":len(data)})
          (dest/"IMAGE-MANIFEST.json").write_text(json.dumps(items,ensure_ascii=False,indent=2),encoding="utf-8")
          lines=["# Images extracted from the supplied ZIP","",f"Total valid raster images: {len(items)}","", "| File | Original path in ZIP | Dimensions | Aspect ratio | Size |","|---|---|---:|---:|---:|"]
          for x in items:
              lines.append(f"| {Path(x['file']).name} | {x['source'].replace('|','\\|')} | {x['width']} × {x['height']} | {x['ratio']} | {x['bytes']:,} bytes |")
          (dest/"IMAGE-MANIFEST.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          thumbs=[]
          for x in items:
              try:
                  im=Image.open(x["file"]).convert("RGB")
                  im.thumbnail((240,150))
                  tile=Image.new("RGB",(260,190),"white")
                  tile.paste(im,((260-im.width)//2,8))
                  d=ImageDraw.Draw(tile)
                  label=Path(x["file"]).name[:34]
                  d.text((8,164),label,fill="black")
                  thumbs.append(tile)
              except Exception: pass
          if thumbs:
              cols=4; rows=(len(thumbs)+cols-1)//cols
              sheet=Image.new("RGB",(cols*260,rows*190),(235,235,235))
              for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*260,(i//cols)*190))
              sheet.save(dest/"contact-sheet.jpg",quality=84,optimize=True)
          print(f"Extracted {len(items)} images")
          PY
      - name: Commit extracted media inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/zip-import
          git diff --cached --quiet || (git commit -m "Extract media from supplied project ZIP for review" && git push)
