name: Khaledoon rebuild foundation checks # contract and V1-V2 adapter CI
on:
  push:
    branches: [rebuild/khaledoon-foundation-2026-10-26]
  pull_request:
    paths: ['rebuild/**', '.github/workflows/rebuild-foundation.yml']
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check V2 runtime and builder syntax
        run: node --check rebuild/reader.js && node --check rebuild/build-story.mjs && node --check rebuild/validate-package.mjs && node --check scripts/check-new-story-readiness.js
      - name: Run contract and V2 reader regression tests
        run: node --test rebuild/tests/*.test.mjs
      - run: node -e "JSON.parse(require('node:fs').readFileSync('rebuild/story-contract.json','utf8'))"
