name: Arabic pronunciation reviewer checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/review_pronunciation.py'
      - 'scripts/generate_story_audio.py'
      - 'scripts/audio_text_guard.py'
      - 'tests/test_audio_text_guard.py'
      - 'tests/test_generate_story_audio_cli.py'
      - '.github/workflows/story-audio.yml'
      - 'tests/test_review_pronunciation.py'
      - 'stories/science/015/story.json'
      - 'stories/science/015/audio-pronunciation.json'
      - 'assets/audio/science/magdi-yacoub/ar/manifest.json'
      - '.github/workflows/pronunciation-review.yml'

permissions:
  contents: read

concurrency:
  group: pronunciation-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reviewer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile reviewer and guarded audio generator
        run: python -m py_compile scripts/review_pronunciation.py scripts/generate_story_audio.py

      - name: Run pronunciation text guard tests
        run: python -m unittest discover -s tests -p 'test_audio_text_guard.py' -v

      - name: Run generator CLI and confirmation tests
        run: python -m unittest discover -s tests -p 'test_generate_story_audio_cli.py' -v

      - name: Verify every Magdi Yacoub Arabic override preserves visible wording
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from audio_text_guard import validate_pronunciation_blocks
          story = json.loads(Path("stories/science/015/story.json").read_text(encoding="utf-8"))
          pronunciation = json.loads(Path("stories/science/015/audio-pronunciation.json").read_text(encoding="utf-8"))
          validate_pronunciation_blocks(story["i18n"]["ar"]["blocks"], pronunciation["blocks"])
          print("PASS: all Arabic audio overrides preserve visible words and order.")
          PY

      - name: Run focused unit and pilot integration tests
        run: python -m unittest discover -s tests -p 'test_review_pronunciation.py' -v

      - name: Run the read-only pilot report
        run: python scripts/review_pronunciation.py --all-blocks --report "$RUNNER_TEMP/pronunciation-review.json"

      - name: Print pilot block 001 and all-block summary for review
        run: |
          python -c 'import json, pathlib; p=pathlib.Path("'"$RUNNER_TEMP"'/pronunciation-review.json"); r=json.loads(p.read_text(encoding="utf-8")); print(json.dumps({"summary": r["summary"], "pilot_block_001": r["blocks"][1]}, ensure_ascii=False, indent=2))'

      - name: Block PR when saved audio text differs from visible story
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["RUNNER_TEMP"]) / "pronunciation-review.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          summary = report["summary"]
          result = summary["overall_textual_result"]
          failed = [
              block for block in report["blocks"]
              if block.get("overall_textual_result") != "PASS"
          ]
          if result != "PASS" or failed:
              details = [
                  f"block {block.get('block_index')}: {block.get('overall_textual_result')}"
                  for block in failed
              ]
              print(f"BLOCKED: textual audio integrity result is {result}.")
              print("Review required: " + ", ".join(details))
              raise SystemExit(1)
          print("PASS: every saved manifest text matches the visible story words and order.")
          print("Note: this check does not test spoken pronunciation.")
          PY
