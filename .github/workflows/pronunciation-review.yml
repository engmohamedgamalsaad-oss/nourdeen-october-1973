name: Arabic pronunciation reviewer checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/review_pronunciation.py'
      - 'scripts/generate_story_audio.py'
      - 'scripts/arabic_pronunciation.py'
      - 'scripts/test_arabic_pronunciation.py'
      - 'audio/pronunciation/**'
      - 'tests/test_review_pronunciation.py'
      - 'stories/science/015/story.json'
      - 'stories/science/015/audio-pronunciation.json'
      - 'assets/audio/science/magdi-yacoub/ar/manifest.json'
      - '.github/workflows/pronunciation-review.yml'

permissions:
  contents: write

concurrency:
  group: pronunciation-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reviewer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile reviewer and guarded audio generator
        run: python -m py_compile scripts/review_pronunciation.py scripts/generate_story_audio.py

      - name: Install generator dependency for no-cost preflight
        run: python -m pip install edge-tts

      - name: Run guarded audio generator without contacting Fish Audio
        run: python scripts/generate_story_audio.py --dry-run

      - name: Generate approved Magdi Yacoub narrator sample with Fish Audio
        if: github.event.pull_request.head.ref == 'feature/shared-arabic-pronunciation-20261104'
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: python scripts/generate_story_audio.py

      - name: Commit only regenerated Magdi Yacoub Arabic audio to this review branch
        if: github.event.pull_request.head.ref == 'feature/shared-arabic-pronunciation-20261104'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/science/magdi-yacoub/ar/*.mp3 assets/audio/science/magdi-yacoub/ar/manifest.json
          if git diff --cached --quiet; then
            echo 'No audio changes were needed.'
            exit 0
          fi
          git commit -m 'Generate Magdi Yacoub audio using shared Arabic pronunciation dictionary'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Run shared Arabic pronunciation dictionary tests
        run: python scripts/test_arabic_pronunciation.py

      - name: Run focused unit and pilot integration tests
        run: python -m unittest discover -s tests -p 'test_review_pronunciation.py' -v

      - name: Run the read-only pilot report
        run: python scripts/review_pronunciation.py --all-blocks --report "$RUNNER_TEMP/pronunciation-review.json"

      - name: Print pilot block 001 and all-block summary for review
        run: |
          python -c 'import json, pathlib; p=pathlib.Path("'"$RUNNER_TEMP"'/pronunciation-review.json"); r=json.loads(p.read_text(encoding="utf-8")); print(json.dumps({"summary": r["summary"], "pilot_block_001": r["blocks"][1]}, ensure_ascii=False, indent=2))'
