name: Arabic pronunciation reviewer checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/review_pronunciation.py'
      - 'scripts/review_audio_pronunciation.py'
      - 'tests/test_audio_pronunciation_review.py'
      - 'scripts/audit_story_audio.py'
      - 'khaledoon/assets/audio-text-review.js'
      - 'khaledoon/admin.html'
      - 'khaledoon/assets/audio-review-core.js'
      - 'khaledoon/tests/audio-review-core.test.cjs'
      - 'rebuild/reader.js'
      - 'rebuild/reader-audio-review.js'
      - 'rebuild/reader-review-actions.js'
      - 'rebuild/reader.html'
      - 'tests/admin-speech-review-ui.test.cjs'
      - 'tests/audio-text-review.test.cjs'
      - 'tests/test_audit_story_audio.py'
      - 'tests/test_audio_generation_safety.py'
      - 'scripts/generate_story_audio.py'
      - 'tests/test_review_pronunciation.py'
      - 'stories/science/015/story.json'
      - 'stories/science/015/audio-pronunciation.json'
      - 'assets/audio/science/magdi-yacoub/ar/manifest.json'
      - '.github/workflows/pronunciation-review.yml'
      - '.github/workflows/story-audio.yml'
      - '.github/workflows/story-audio-single-block.yml'
      - 'docs/audio-review-workflow.md'

permissions:
  contents: read

concurrency:
  group: pronunciation-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reviewer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile reviewer and guarded audio generator
        run: python -m py_compile scripts/review_pronunciation.py scripts/review_audio_pronunciation.py scripts/generate_story_audio.py scripts/audit_story_audio.py

      - name: Install generator dependency for no-cost preflight
        run: python -m pip install edge-tts

      - name: Run guarded audio generator without contacting Fish Audio
        run: python scripts/generate_story_audio.py --story stories/science/015/story.json

      - name: Run focused unit and pilot integration tests
        run: python -m unittest discover -s tests -p 'test_review_pronunciation.py' -v

      - name: Run read-only story audio inventory tests
        run: python -m unittest discover -s tests -p 'test_audit_story_audio.py' -v

      - name: Run isolated audio generation safety tests
        run: python -m unittest discover -s tests -p 'test_audio_generation_safety.py' -v

      - name: Run read-only ASR review logic tests
        run: python -m unittest discover -s tests -p 'test_audio_pronunciation_review.py' -v

      - name: Run existing post-generation audio reviewer regression tests
        run: node khaledoon/tests/audio-review-core.test.cjs

      - name: Run multilingual speech-text reviewer tests
        run: node --test tests/audio-text-review.test.cjs
        
      - name: Check admin speech-review integration
        run: node --test tests/admin-speech-review-ui.test.cjs

      - name: Run the read-only pilot report
        run: python scripts/review_pronunciation.py --all-blocks --report "$RUNNER_TEMP/pronunciation-review.json"

      - name: Print pilot block 001 and all-block summary for review
        run: |
          python -c 'import json, pathlib; p=pathlib.Path("'"$RUNNER_TEMP"'/pronunciation-review.json"); r=json.loads(p.read_text(encoding="utf-8")); print(json.dumps({"summary": r["summary"], "pilot_block_001": r["blocks"][1]}, ensure_ascii=False, indent=2))'

      - name: Install local ASR for one real published Arabic clip
        run: python -m pip install faster-whisper

      - name: Prepare an isolated one-clip ASR fixture (no repository audio is changed)
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path

          source = Path("assets/audio/science/magdi-yacoub/ar")
          destination = Path(os.environ["RUNNER_TEMP"]) / "audio-asr-pilot/science/magdi-yacoub/ar"
          destination.mkdir(parents=True, exist_ok=True)
          manifest = json.loads((source / "manifest.json").read_text(encoding="utf-8"))
          selected = [item for item in manifest["segments"] if item.get("block_index") == 1]
          if len(selected) != 1:
              raise SystemExit(f"Expected exactly one published block 1 clip, found {len(selected)}")
          item = dict(selected[0])
          audio_file = source / item["src"]
          if not audio_file.is_file():
              raise SystemExit(f"Published audio file missing: {audio_file}")
          shutil.copy2(audio_file, destination / item["src"])
          item["audio_sha256"] = hashlib.sha256(audio_file.read_bytes()).hexdigest()
          manifest["segments"] = [item]
          (destination / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8",
          )
          print("Prepared one published MP3 in runner temp storage.")
          print("SHA-256 is computed for this run only; the repository manifest remains unchanged.")
          PY

      - name: Run ASR on the published Arabic clip (one selected block, read-only)
        run: |
          python scripts/review_audio_pronunciation.py \\
            --story stories/science/015/story.json \\
            --language ar \\
            --audio-root "$RUNNER_TEMP/audio-asr-pilot" \\
            --block-index 1 \\
            --model base \\
            --device cpu \\
            --compute-type int8 \\
            --output "$RUNNER_TEMP/magdi-yacoub-asr-pilot.json"
          python -c 'import json, pathlib; p=pathlib.Path("'"$RUNNER_TEMP"'/magdi-yacoub-asr-pilot.json"); r=json.loads(p.read_text(encoding="utf-8")); print(json.dumps({"story": r["story"], "language": r["language"], "selected_blocks": r["selected_blocks"], "summary": r["summary"], "clip": r["reports"][0]}, ensure_ascii=False, indent=2))'
