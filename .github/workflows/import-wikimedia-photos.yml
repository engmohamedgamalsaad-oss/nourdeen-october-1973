name: Import licensed Wikimedia photos

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download the two Wikimedia source files without resizing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stories/october/002 stories/october/004
          curl --fail --location --silent --show-error \
            'https://commons.wikimedia.org/wiki/Special:FilePath/Crossing_the_Bar_Lev_Line,_October_War.jpg' \
            --output stories/october/002/Crossing_the_Bar_Lev_Line,_October_War.jpg
          curl --fail --location --silent --show-error \
            'https://upload.wikimedia.org/wikipedia/commons/1/1d/Atef_El_Sadat.jpg' \
            --output stories/october/004/Atef_El_Sadat.jpg
          file stories/october/002/Crossing_the_Bar_Lev_Line,_October_War.jpg stories/october/004/Atef_El_Sadat.jpg
          grep -aq 'JFIF\|Exif' stories/october/002/Crossing_the_Bar_Lev_Line,_October_War.jpg || true
          test "$(od -An -tx1 -N2 stories/october/002/Crossing_the_Bar_Lev_Line,_October_War.jpg | tr -d ' \n')" = 'ffd8'
          test "$(od -An -tx1 -N2 stories/october/004/Atef_El_Sadat.jpg | tr -d ' \n')" = 'ffd8'
          test "$(wc -c < stories/october/002/Crossing_the_Bar_Lev_Line,_October_War.jpg)" -gt 1000
          test "$(wc -c < stories/october/004/Atef_El_Sadat.jpg)" -gt 1000

      - name: Propose imported photos
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- stories/october/002/Crossing_the_Bar_Lev_Line,_October_War.jpg stories/october/004/Atef_El_Sadat.jpg
          if git diff --cached --quiet; then
            echo 'No image changes to propose.'
            exit 0
          fi
          branch="codex/import-wikimedia-photos-\${GITHUB_RUN_ID}"
          git switch --create "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add licensed Wikimedia photos locally'
          git push origin "HEAD:$branch"
          gh pr create --base main --head "$branch" --title 'Import licensed Wikimedia photos' --body 'Review the imported image files and their source licenses before merging.'
