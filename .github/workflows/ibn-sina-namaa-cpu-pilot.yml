name: Ibn Sina Arabic and English CPU voice pilot

on:
  push:
    branches:
      - audio/ibn-sina-namaa-cpu-pilot
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibn-sina-namaa-cpu-pilot
  cancel-in-progress: false

jobs:
  generate-preview:
    name: Generate four private preview clips on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install Chatterbox runtime
        run: |
          python -m pip install --no-deps chatterbox-tts==0.1.7
          python -m pip install \
            numpy==1.26.4 \
            librosa==0.11.0 \
            s3tokenizer \
            transformers==5.2.0 \
            diffusers==0.29.0 \
            git+https://github.com/resemble-ai/Perth.git@master \
            conformer==0.3.2 \
            safetensors==0.5.3 \
            spacy-pkuseg \
            pykakasi==2.3.0 \
            pyloudnorm \
            omegaconf \
            huggingface_hub \
            soundfile

      - name: Generate Arabic and English voice previews
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: python scripts/ibn_sina_tts_cpu_pilot.py

      - name: Upload private review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibn-sina-namaa-cpu-pilot
          path: artifacts/ibn-sina-tts-pilot/
          if-no-files-found: ignore
          retention-days: 7
