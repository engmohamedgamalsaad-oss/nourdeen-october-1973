name: Ibn Sina NAMAA first Arabic preview
run-name: ابن سينا audio ${{ inputs.request_id || '00000000-0000-4000-8000-000000000001' }} block ${{ inputs.block_index || '0' }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Review request UUID
        required: true
        type: string
      block_index:
        description: Arabic story block index
        required: true
        default: "0"
        type: string
      speech_text_b64:
        description: Base64 UTF-8 approved speech text from the private review record
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ibn-sina-namaa-segment
  cancel-in-progress: false

jobs:
  generate-preview:
    name: Generate one private Arabic segment via NAMAA Space
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Gradio client
        run: |
          python -m pip install --upgrade pip
          python -m pip install gradio_client==1.10.2 soundfile numpy requests

      - name: Generate one Arabic segment
        env:
          REQUEST_ID: ${{ inputs.request_id || '00000000-0000-4000-8000-000000000001' }}
          BLOCK_INDEX: ${{ inputs.block_index || '0' }}
          SPEECH_TEXT_B64: ${{ inputs.speech_text_b64 }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/ibn_sina_tts_cpu_pilot.py

      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibn-sina-arabic-audio-staging
          path: artifacts/ibn-sina-audio-staging/
          if-no-files-found: error
          retention-days: 7
