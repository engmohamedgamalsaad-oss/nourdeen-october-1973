name: Ibn Sina Arabic and English CPU voice pilot

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ibn-sina-namaa-cpu-pilot-current
  cancel-in-progress: true

jobs:
  generate-preview:
    name: Generate four private preview clips on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Checkout NAMAA-compatible Chatterbox source
        run: |
          git clone https://huggingface.co/spaces/omarelshehy/NAMAA-Egyptian-Voice "$RUNNER_TEMP/namaa-space"
          git -C "$RUNNER_TEMP/namaa-space" checkout 4a71cd1f43edd2f916f2204de88f0392cac21315

      - name: Patch pretrained checkpoint loading for CPU-only runners
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "namaa-space/src/chatterbox/mtl_tts.py"
          source = p.read_text(encoding="utf-8")
          replacements = {
              'torch.load(ckpt_dir / "ve.pt", weights_only=True)': 'torch.load(ckpt_dir / "ve.pt", map_location=torch.device(device), weights_only=True)',
              'torch.load(ckpt_dir / "s3gen.pt", weights_only=True)': 'torch.load(ckpt_dir / "s3gen.pt", map_location=torch.device(device), weights_only=True)',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"Expected CPU-incompatible load call not found: {old}")
              source = source.replace(old, new)
          p.write_text(source, encoding="utf-8")
          print("Patched both pretrained torch.load calls to map CUDA tensors onto CPU.")
          PY

      - name: Install NAMAA runtime dependencies
        run: |
          python -m pip install \
            numpy==1.26.0 \
            resampy==0.4.3 \
            librosa==0.10.0 \
            s3tokenizer \
            transformers==4.46.3 \
            diffusers==0.29.0 \
            omegaconf==2.3.0 \
            resemble-perth==1.0.1 \
            silero-vad==5.1.2 \
            conformer==0.3.2 \
            safetensors \
            soundfile \
            spacy_pkuseg \
            "pykakasi>=2.2.0" \
            pyloudnorm \
            huggingface_hub==0.36.0

      - name: Generate Arabic and English voice previews
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          NAMAA_SOURCE_DIR: ${{ runner.temp }}/namaa-space
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: python scripts/ibn_sina_tts_cpu_pilot.py

      - name: Upload private review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ibn-sina-namaa-cpu-pilot
          path: artifacts/ibn-sina-tts-pilot/
          if-no-files-found: ignore
          retention-days: 7
