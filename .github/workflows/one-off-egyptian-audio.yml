name: One-off Egyptian Arabic voice pair sample

on:
  pull_request_target:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  generate:
    if: github.event.pull_request.number == 515 && github.event.pull_request.head.ref == 'feat/egyptian-dialect-reviewer-20261104' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the exact authorized sample branch
        uses: actions/checkout@v4
        with:
          ref: feat/egyptian-dialect-reviewer-20261104
          persist-credentials: true
      - name: Generate narrator and Karma listening samples with their selected Fish voices
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, pathlib
          key = os.environ.get("FISH_AUDIO_API_KEY", "").strip()
          if not key:
              raise SystemExit("FISH_AUDIO_API_KEY is missing")
          samples = [
              (
                  "narrator-tone-original.mp3",
                  "assets/audio/science/magdi-yacoub/ar/narrator-tone-original.mp3",
                  "b65cfd7ce5e44607aedafeea3dbb01e8",
                  "خلّينا نكمل الحكاية بهدوء. مجدي يعقوب ماكانش مجرد جرّاح شاطر؛ ده كان طبيب عنده إصرار كبير، واشتغل سنين طويلة علشان يطوّر جراحات القلب ويساعد مرضى كتير.",
              ),
              (
                  "karma-tone-original.mp3",
                  "assets/audio/science/magdi-yacoub/ar/karma-tone-original.mp3",
                  "592625f68416462f8b6161ddf5fdbffb",
                  "يا ترى إزاي دكتور واحد قدر يساعد العدد الكبير ده من المرضى؟ أكيد الموضوع محتاج علم وتعب، وكمان قلب بيحب يساعد الناس!",
              ),
          ]
          for name, path, voice, text in samples:
              payload = json.dumps({
                  "text": text,
                  "reference_id": voice,
                  "format": "mp3",
              }, ensure_ascii=False).encode()
              request = urllib.request.Request(
                  "https://api.fish.audio/v1/tts",
                  data=payload,
                  headers={
                      "Authorization": "Bearer " + key,
                      "Content-Type": "application/json",
                      "model": "s2.1-pro-free",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=90) as response:
                  audio = response.read()
              if len(audio) < 512:
                  raise SystemExit(f"Fish Audio returned an invalid file for {name}")
              target = pathlib.Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(audio)
              print(f"GENERATED {path}: {len(audio)} bytes; voice={voice}")
          PY
      - name: Commit only the two isolated listening samples
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/science/magdi-yacoub/ar/narrator-tone-original.mp3 assets/audio/science/magdi-yacoub/ar/karma-tone-original.mp3
          git diff --cached --quiet && { echo 'No audio samples were generated'; exit 1; }
          git commit -m 'Add selected narrator and Karma tone samples'
          git push origin HEAD:refs/heads/feat/egyptian-dialect-reviewer-20261104
