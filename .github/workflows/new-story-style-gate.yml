name: Unified story package audit

# Validate every canonical story package on every relevant PR.
# Existing-story editorial findings are reported without rewriting history;
# newly added stories must pass the full style gate.
on:
  pull_request:
    paths:
      - "stories/**/story.json"
      - "stories/**/index.html"
      - "rebuild/validate-style.mjs"
      - "rebuild/validate-package.mjs"
      - "rebuild/validate-story.mjs"
      - ".github/workflows/new-story-style-gate.yml"

permissions:
  contents: read

jobs:
  all-story-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate structure and canonical reader wiring for every story
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          report="$RUNNER_TEMP/story-style-audit.txt"
          : > "$report"

          mapfile -t files < <(git ls-files 'stories/*/*/story.json')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No canonical story packages found." >&2
            exit 1
          fi

          for f in "${files[@]}"; do
            echo "== Structural validation: $f"
            node rebuild/validate-package.mjs "$f" || status=1
            node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(s.format!=="KHALEDOON_STORY"){console.error("Non-canonical package format in "+process.argv[1]+": "+s.format);process.exit(1)}' "$f" || status=1

            page="${f%/story.json}/index.html"
            if [ ! -f "$page" ]; then
              echo "Missing reader page: $page" >&2
              status=1
            elif ! grep -q 'data-kh-story-reader' "$page" || ! grep -q 'data-story-path="story.json"' "$page"; then
              echo "Non-canonical reader wiring: $page" >&2
              status=1
            fi

            echo "== Editorial style audit: $f"
            if node rebuild/validate-package.mjs --style "$f" >> "$report" 2>&1; then
              echo "STYLE PASS: $f"
            else
              if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then
                echo "STYLE REVIEW REQUIRED (existing content; non-blocking): $f"
                cat "$report" | tail -n 35
              else
                echo "STYLE FAIL (new story): $f" >&2
                cat "$report" >&2
                status=1
              fi
            fi
            : > "$report"
          done

          legacy_files=$(find stories -path 'stories/october' -prune -o -name 'data.v2.json' -print)
          if [ -n "$legacy_files" ]; then
            echo "Legacy story package files remain outside the protected October section:" >&2
            echo "$legacy_files" >&2
            status=1
          fi

          exit "$status"
