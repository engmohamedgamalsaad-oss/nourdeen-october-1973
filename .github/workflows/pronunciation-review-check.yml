name: Pronunciation review tool checks

on:
  pull_request:
    paths:
      - "scripts/review_pronunciation.py"
      - "stories/science/015/story.json"
      - "stories/science/015/audio-pronunciation.json"
      - "assets/audio/science/magdi-yacoub/ar/manifest.json"
      - ".github/workflows/pronunciation-review-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-pronunciation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile reviewer
        run: python -m py_compile scripts/review_pronunciation.py

      - name: Review Magdi Yacoub Arabic pilot block 001
        run: python scripts/review_pronunciation.py --block-index 1 --fail-on-mismatch
