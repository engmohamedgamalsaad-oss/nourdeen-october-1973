name: Localize external images

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localize-external-images
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run image localizer
        run: python scripts/localize-external-images.py

      - name: Create branch and commit localized images
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="codex/localize-images-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add assets/images/stories stories khaledoon/collections khaledoon/assets/story-collections.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Localize external story images"
          git push origin "$BRANCH"
          echo "LOCALIZE_BRANCH=$BRANCH" >> "$GITHUB_STEP_SUMMARY"
