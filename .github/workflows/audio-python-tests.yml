name: October package and OmniVoice Python tests

on:
  push:
    branches: ["ci/october-audio-python-tests-20261106"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/audio-python-tests.yml"
      - "scripts/build_october_audio_packages.py"
      - "scripts/omnivoice_engine/**"
      - "tests/test_october_audio_packages.py"
      - "tests/test_omnivoice_engine.py"
      - "tests/test_audit_story_audio.py"
      - "stories/october/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-python-tests:
    name: October package and OmniVoice tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run October package and read-only audio inventory tests
        run: python -m unittest tests.test_october_audio_packages tests.test_audit_story_audio -v

      - name: Run unified OmniVoice worker unit tests
        run: python -m unittest tests.test_omnivoice_engine -v

      - name: Verify October package extraction without writing
        run: python3 scripts/build_october_audio_packages.py --no-write
