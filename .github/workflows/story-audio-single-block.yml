name: story-audio-single-block-staging
run-name: "Khaledoon audio ${{ inputs.request_id }} ${{ inputs.story_path }} ${{ inputs.language }} block ${{ inputs.block_index }}"

on:
  workflow_dispatch:
    inputs:
      story_path:
        description: "المسار الموحد stories/<section>/<id>/story.json لجميع الأقسام، بما فيها أكتوبر"
        required: true
        type: string
      language:
        description: "لغة المقطع"
        required: true
        type: choice
        options:
          - ar
          - en
          - fr
          - it
          - de
      block_index:
        description: "رقم المقطع بفهرس يبدأ من صفر"
        required: true
        type: number
        default: 0
      source_run_id:
        description: "اختياري: آخر تشغيل يحتوي مساحة التجهيز السابقة للحفاظ على المقاطع المقبولة"
        required: false
        type: string
      request_id:
        description: "معرّف طلب فريد لمطابقة نتيجة التوليد مع طلب صفحة المراجعة"
        required: true
        type: string
      confirm_fish_audio_request:
        description: "للعربية فقط: اختر yes بعد الموافقة الصريحة على طلب Fish Audio"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read
  actions: read

concurrency:
  group: story-audio-single-block-staging
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build canonical October package when selected
        if: startsWith(inputs.story_path, 'stories/october/')
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Extract October audio source without changing published pages
        if: startsWith(inputs.story_path, 'stories/october/')
        run: python scripts/build_october_audio_packages.py

      - name: Validate regeneration source and require prior staging for October
        env:
          STORY_PATH: ${{ inputs.story_path }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$STORY_PATH" =~ ^stories/[a-z0-9-]+/[0-9]{3}/story\.json$ ]]; then
            echo "Invalid canonical story path."
            exit 1
          fi
          if [[ "$STORY_PATH" == stories/october/* && -z "$SOURCE_RUN_ID" ]]; then
            echo "October has no published audio baseline. Supply the all-stories staging run ID so the other accepted clips are preserved."
            exit 1
          fi
          if [[ -n "$SOURCE_RUN_ID" && ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Source run ID must contain digits only."
            exit 1
          fi

      - name: Restore the previous single-block staging artifact
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: khaledoon-single-block-audio-staging
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .audio-staging/

      - name: Install pinned Edge TTS dependency
        run: python -m pip install --disable-pip-version-check "edge-tts==7.2.0"

      - name: Validate generator syntax
        run: python -m py_compile scripts/generate_story_audio.py

      - name: Require explicit Fish Audio approval for Arabic
        env:
          LANGUAGE: ${{ inputs.language }}
          FISH_APPROVAL: ${{ inputs.confirm_fish_audio_request }}
        run: |
          if [ "$LANGUAGE" = "ar" ] && [ "$FISH_APPROVAL" != "yes" ]; then
            echo "Arabic regeneration stopped: explicit Fish Audio approval was not supplied."
            exit 1
          fi

      - name: Regenerate Arabic block into isolated staging
        if: inputs.language == 'ar'
        env:
          STORY_PATH: ${{ inputs.story_path }}
          LANGUAGE: ${{ inputs.language }}
          BLOCK_INDEX: ${{ inputs.block_index }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_story_audio.py \
            --story "$STORY_PATH" \
            --languages "$LANGUAGE" \
            --force-block "$BLOCK_INDEX" \
            --generate \
            --allow-fish-audio

      - name: Regenerate non-Arabic block into isolated staging
        if: inputs.language != 'ar'
        env:
          STORY_PATH: ${{ inputs.story_path }}
          LANGUAGE: ${{ inputs.language }}
          BLOCK_INDEX: ${{ inputs.block_index }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_story_audio.py \
            --story "$STORY_PATH" \
            --languages "$LANGUAGE" \
            --force-block "$BLOCK_INDEX" \
            --generate
      - name: Upload updated staging package for manual review only
        uses: actions/upload-artifact@v4
        with:
          name: khaledoon-single-block-audio-staging
          path: .audio-staging/
          if-no-files-found: error
          retention-days: 7
