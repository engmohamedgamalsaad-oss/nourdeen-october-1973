name: story-audio-single-block-staging

on:
  workflow_dispatch:
    inputs:
      story_path:
        description: "المسار الموحد stories/<section>/<id>/story.json لجميع الأقسام، بما فيها أكتوبر"
        required: true
        type: string
      language:
        description: "لغة المقطع"
        required: true
        type: choice
        options:
          - ar
          - en
          - fr
          - it
          - de
      block_index:
        description: "رقم المقطع بفهرس يبدأ من صفر"
        required: true
        type: number
        default: 0
      confirm_fish_audio_request:
        description: "للعربية فقط: اختر yes بعد الموافقة الصريحة على طلب Fish Audio"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: story-audio-single-block-staging
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}

      - name: Install Edge TTS dependency
        run: python -m pip install edge-tts

      - name: Validate generator syntax
        run: python -m py_compile scripts/generate_story_audio.py

      - name: Require explicit Fish Audio approval for Arabic
        env:
          LANGUAGE: ${{ inputs.language }}
          FISH_APPROVAL: ${{ inputs.confirm_fish_audio_request }}
        run: |
          if [ "$LANGUAGE" = "ar" ] && [ "$FISH_APPROVAL" != "yes" ]; then
            echo "Arabic regeneration stopped: explicit Fish Audio approval was not supplied."
            exit 1
          fi

      - name: Regenerate Arabic block into isolated staging
        if: inputs.language == 'ar'
        env:
          STORY_PATH: ${{ inputs.story_path }}
          LANGUAGE: ${{ inputs.language }}
          BLOCK_INDEX: ${{ inputs.block_index }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_story_audio.py \
            --story "$STORY_PATH" \
            --languages "$LANGUAGE" \
            --force-block "$BLOCK_INDEX" \
            --generate \
            --allow-fish-audio

      - name: Regenerate non-Arabic block into isolated staging
        if: inputs.language != 'ar'
        env:
          STORY_PATH: ${{ inputs.story_path }}
          LANGUAGE: ${{ inputs.language }}
          BLOCK_INDEX: ${{ inputs.block_index }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_story_audio.py \
            --story "$STORY_PATH" \
            --languages "$LANGUAGE" \
            --force-block "$BLOCK_INDEX" \
            --generate
      - name: Upload regenerated clip for manual review only
        uses: actions/upload-artifact@v4
        with:
          name: khaledoon-single-block-audio-staging
          path: .audio-staging/
          if-no-files-found: error
          retention-days: 7
