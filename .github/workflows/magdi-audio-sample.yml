name: Generate one Magdi Yacoub pronunciation sample

on:
  push:
    branches:
      - feature/magdi-contextual-pronunciation-20261104
    paths:
      - ".github/workflows/run-magdi-audio-sample.trigger"

permissions:
  contents: write

concurrency:
  group: magdi-audio-sample
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact sample branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the generator's validation dependency
        run: python -m pip install edge-tts

      - name: Validate the one-block scope without spending credits
        run: python scripts/generate_story_audio.py --dry-run

      - name: Generate the approved Fish Audio sample
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: python scripts/generate_story_audio.py

      - name: Upload the actual MP3 as a backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: magdi-yacoub-ar-007-mp3
          path: assets/audio/science/magdi-yacoub/ar/007.mp3
          if-no-files-found: error
          retention-days: 7

      - name: Publish only the generated sample to its branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio/science/magdi-yacoub/ar/007.mp3 assets/audio/science/magdi-yacoub/ar/manifest.json
          git diff --cached --quiet && { echo "No audio changes produced"; exit 1; }
          git commit -m 'Save generated Magdi Yacoub narrator sample'
          git push origin HEAD:feature/magdi-contextual-pronunciation-20261104
