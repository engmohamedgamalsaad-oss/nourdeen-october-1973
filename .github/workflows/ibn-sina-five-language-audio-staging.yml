name: ibn-sina-arabic-audio-staging

on:
  workflow_dispatch:
    inputs:
      confirm_fish_audio_request:
        description: "اختر yes للموافقة على إعادة توليد 17 مقطعًا عربيًا لابن سينا"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: ibn-sina-arabic-audio-staging
  cancel-in-progress: false

jobs:
  generate:
    if: inputs.confirm_fish_audio_request == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out approved Ibn Sina story and audio text
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify generator syntax
        run: python -m py_compile scripts/generate_story_audio.py

      - name: Generate Arabic only into isolated staging
        env:
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
        run: >-
          python scripts/generate_story_audio.py
          --story stories/history/005/story.json
          --languages ar
          --generate
          --allow-fish-audio

      - name: Upload Arabic audio and manifest for listening review only
        uses: actions/upload-artifact@v4
        with:
          name: ibn-sina-arabic-audio-staging
          path: .audio-staging/history/ibn-sina/ar/
          if-no-files-found: error
          retention-days: 14
