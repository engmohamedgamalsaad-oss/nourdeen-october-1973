<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc"><title id="title">محطات من الحركة العرابية</title><desc id="desc">مخطط زمني توضيحي للأعوام 1841 و1881 و1882</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101a2b"/><stop offset="1" stop-color="#34274f"/></linearGradient></defs><rect width="1400" height="650" rx="32" fill="url(#bg)"/><path d="M180 330H1220" stroke="#e3bd78" stroke-width="8" stroke-linecap="round"/><g fill="#d5b7ff" stroke="#e3bd78" stroke-width="8"><circle cx="250" cy="330" r="28"/><circle cx="700" cy="330" r="28"/><circle cx="1150" cy="330" r="28"/></g><g fill="#f5dfb4" font-family="Cairo,Tahoma,sans-serif" font-weight="700" text-anchor="middle"><text x="250" y="220" font-size="58">1841</text><text x="700" y="220" font-size="58">1881</text><text x="1150" y="220" font-size="58">1882</text><text x="250" y="420" font-size="30">ميلاد أحمد عرابي</text><text x="700" y="420" font-size="30">مظاهرة عابدين</text><text x="1150" y="420" font-size="30">التل الكبير والاحتلال</text><text x="700" y="550" font-size="24" fill="#d9d3e6">مخطط تعليمي مبسط — ليس وثيقة تاريخية</text></g></svg>