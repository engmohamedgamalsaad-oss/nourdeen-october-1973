     e:L('كان النقيب طيار عاطف السادات من شهداء الضربة الجوية الأولى.','Captain Atef El-Sadat, a pilot, was among the martyrs of the first air strike.','Le capitaine pilote Atef El-Sadat compte parmi les martyrs de la première frappe aérienne.','Il capitano pilota Atef El-Sadat fu tra i martiri del primo attacco aereo.')},
    {s:'004',a:1,
     q:L('لماذا لا تعرض الحكاية رقمًا واحدًا نهائيًا لخسائر الضربة الأولى؟','Why does the story avoid giving one final number for the first strike’s losses?','Pourquoi le récit ne donne-t-il pas un seul chiffre définitif pour les pertes de la première frappe ?','Perché il racconto non indica un unico numero definitivo per le perdite del primo attacco?'),
     o:[L('لأن الأرقام ممنوع ذكرها','Because numbers may not be mentioned','Parce qu’il est interdit de citer des chiffres','Perché non si possono citare i numeri'),L('لأن المصادر تختلف في الأعداد والتفاصيل','Because sources differ on numbers and details','Parce que les sources diffèrent sur les chiffres et les détails','Perché le fonti differiscono su numeri e dettagli'),L('لأن الحكاية لا تهتم بالتاريخ','Because the story does not care about history','Parce que le récit ne s’intéresse pas à l’histoire','Perché il racconto non si interessa alla storia'),L('لأن الأعداد لم تتغير أبدًا','Because the numbers never changed','Parce que les chiffres n’ont jamais changé','Perché i numeri non sono mai cambiati')],
     e:L('بعض المصادر تتحدث عن خسائر الضربة الأولى وحدها وأخرى عن خسائر القتال الجوي في اليوم الأول كله، فنتحرّى الدقة ولا نجزم.','Some sources count only the first strike, others the whole first day of air fighting, so we stay careful and do not claim a single figure.','Certaines sources ne comptent que la première frappe, d’autres toute la première journée de combat aérien ; nous restons prudents.','Alcune fonti contano solo il primo attacco, altre l’intera prima giornata di combattimenti aerei; restiamo prudenti.')}
  ];

  var order = [], idx = 0, score = 0, locked = false;
  var quizPanel = document.getElementById('quizPanel');
  var resultPanel = document.getElementById('resultPanel');

  function el(tag, cls, text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
  function pick(o){return o[lang]||o.ar;}

  /* Shuffle options per question so the right answer is not always first. */
  function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}

  function start(){
    order = Q.map(function(q){return {q:q, opts:shuffle(q.o.map(function(o,i){return {i:i,o:o};}))};});
    idx = 0; score = 0; locked = false;
    resultPanel.hidden = true; quizPanel.hidden = false;
    render();
  }

  function render(){
    var item = order[idx], q = item.q, total = order.length;
    quizPanel.innerHTML = '';
    var prog = el('div','progress');
    prog.appendChild(el('span','',u('qOf',{n:idx+1,t:total})));
    var bar = el('div','bar'); var fill = el('i'); fill.style.width = (idx/total*100)+'%'; bar.appendChild(fill); prog.appendChild(bar);
    quizPanel.appendChild(prog);
    quizPanel.appendChild(el('span','tag',pick(STORY[q.s])));
    var h = el('h2','q',pick(q.q)); h.id='qtext'; quizPanel.appendChild(h);
    var list = el('ul','opts'); list.setAttribute('aria-labelledby','qtext');
    item.opts.forEach(function(x){
      var li = document.createElement('li');
      var b = el('button','opt',pick(x.o)); b.type='button';
      b.addEventListener('click',function(){answer(x.i===q.a,b,list,item);});
      li.appendChild(b); list.appendChild(li);
    });
    quizPanel.appendChild(list);
    locked = false;
    var heading = document.getElementById('qtext'); if(heading){heading.setAttribute('tabindex','-1');}
  }

  function answer(ok, btn, list, item){
    if(locked) return; locked = true;
    var q = item.q;
    if(ok) score++;
    var buttons = list.querySelectorAll('button');
    item.opts.forEach(function(x,k){
      var b = buttons[k]; b.disabled = true;
      var mark = el('span','mark');
      if(x.i===q.a){b.classList.add('correct');mark.textContent='✔';}
      else if(b===btn){b.classList.add('wrong');mark.textContent='✘';}
      b.appendChild(mark);
    });
    var fb = el('div','feedback '+(ok?'ok':'no')); fb.setAttribute('role','status');
    fb.appendChild(el('strong','',ok?u('right'):u('wrong')));
    if(!ok){
      var right = pick(q.o[q.a]);
      fb.appendChild(el('p','',u('correctWas',{a:right})));
    }
    fb.appendChild(el('p','',pick(q.e)));
    var a = el('a','link',u('read')+' « '+pick(STORY[q.s])+' »'); a.href='stories/'+q.s+'/'; a.target='_blank'; a.rel='noopener';
    fb.appendChild(a);
    quizPanel.appendChild(fb);
    var actions = el('div','actions');
    var last = idx===order.length-1;
    var nb = el('button','btn',last?u('finish'):u('next')); nb.type='button';
    nb.addEventListener('click',function(){ if(last) showResult(); else {idx++;render();window.scrollTo({top:0,behavior:'smooth'});document.getElementById('qtext').focus({preventScroll:true});} });
    actions.appendChild(nb); quizPanel.appendChild(actions);
    nb.focus();
  }

  function showResult(){
    var total = order.length;
    quizPanel.hidden = true; resultPanel.hidden = false; resultPanel.innerHTML='';
    var pct = score/total;
    resultPanel.appendChild(el('div','score',u('scoreOf',{s:score,t:total})));
    resultPanel.appendChild(el('p','',pct>=0.85?u('t1'):pct>=0.6?u('t2'):u('t3')));
    resultPanel.appendChild(el('p','',u('thanks')));
    var actions = el('div','actions');
    var again = el('button','btn',u('again')); again.type='button'; again.addEventListener('click',function(){start();window.scrollTo({top:0});});
    var read = el('a','btn alt',u('stories')); read.href='index.html';
    var pr = el('button','btn alt',u('print')); pr.type='button'; pr.addEventListener('click',function(){window.print();});
    actions.appendChild(again); actions.appendChild(read); actions.appendChild(pr);
    resultPanel.appendChild(actions);
    resultPanel.setAttribute('tabindex','-1'); resultPanel.focus();
  }

  document.getElementById('title').textContent = u('title');
  document.getElementById('lead').textContent = u('lead');
  document.getElementById('skipLink').textContent = u('skip');
  document.getElementById('backLink').textContent = u('back');
  var sw = document.querySelector('[data-lang-switch]'); if(sw) sw.setAttribute('aria-label',u('langAria'));
  document.title = u('title') + ' | 1973';
  start();
})();
</script>
